/* ============================================================
   SAIR E VOLTAR
   ============================================================ */
.saiu{max-width:620px;margin:0 auto}
.saiu__c{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);
  padding:30px 32px}
@media(max-width:560px){ .saiu__c{padding:24px 22px} }
.saiu__l{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:11px}
.saiu__l li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;font-size:.94rem;
  color:var(--ink-70);line-height:1.5}
.saiu__l i{width:26px;height:26px;border-radius:50%;background:var(--mist);color:var(--violet);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.68rem;margin-top:1px}
.saiu__l b{color:var(--ink);font-weight:600}
/* faixa de retomada */
.retoma{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--mist),#fff);
  border:1px solid var(--lilac-soft);border-radius:var(--r-lg);padding:15px 18px;margin-bottom:22px;flex-wrap:wrap}
.retoma__t{font-size:.92rem;color:var(--ink);flex:1;min-width:180px}
.retoma__t b{font-weight:600}


.sala{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:26px}
.sc{position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 26px 22px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s}
.sc:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--lilac)}
.sc__faixa{position:absolute;left:0;right:0;top:0;height:5px}
.sc__h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.sc__h>span:first-child{display:block;min-width:0}
.sc__n{display:block;font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;font-size:1.22rem;
  line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.sc__meta{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--slate);margin-top:6px;display:block}
.sc__v{display:block;flex:none;font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:400;font-size:1.9rem;
  line-height:.9;letter-spacing:-.03em;white-space:nowrap}
.sc__v small{font-family:var(--f-mono);font-size:.34em;color:var(--slate);margin-left:2px}
.sc__q{display:block;font-size:.9rem;color:var(--ink-70);line-height:1.55;margin:16px 0 0}
.sc__f{display:block;margin-top:auto;padding-top:18px}
.sc__e{display:flex;justify-content:space-between;align-items:baseline;font-size:.76rem;color:var(--slate);margin-bottom:8px}
.sc__e b{font-family:var(--f-mono);color:var(--ink-70);font-weight:500}
.sc__b{display:block;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.sc__b i{display:block;height:5px;border-radius:999px;background:linear-gradient(90deg,var(--lilac),var(--violet))}
.sc__go{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--violet)}
.sc__go svg{width:15px;height:15px;transition:transform .2s}
.sc:hover .sc__go svg{transform:translateX(3px)}
/* criar sinal, como porta vazia */
.sc--novo{background:linear-gradient(160deg,var(--mist),#fff);border-style:dashed;border-color:var(--lilac-soft);
  align-items:flex-start;justify-content:center;min-height:210px}
.sc--novo:hover{border-style:solid}
.sc--novo .sc__n{margin-top:0}
.sc--novo .sc__q{margin-top:8px}
.sc__mais{width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid var(--lilac-soft);
  color:var(--violet);display:grid;place-items:center;margin-bottom:16px;flex:none}
.sc__mais svg{width:20px;height:20px}

/* ============================================================
   BLOCO 6 · a resposta
   ============================================================ */
.rp{max-width:820px;margin:0 auto}
.rp__pret{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:400;
  font-size:clamp(22px,3vw,30px);line-height:1.26;margin:14px 0 0;color:var(--ink);letter-spacing:-.012em;max-width:34ch}
.rp__box{margin-top:22px;background:#fff;border:1px solid var(--line-2);border-radius:20px;
  box-shadow:var(--shadow-2);padding:22px 24px 18px}
.rp__box textarea{width:100%;border:0;resize:vertical;min-height:210px;font:inherit;font-size:1.06rem;
  line-height:1.68;background:transparent;color:var(--ink)}
.rp__box textarea:focus{outline:0}
.rp__box textarea::placeholder{color:var(--slate-40)}
.rp__r{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:13px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.rp__r .btn--p{margin-left:auto}
/* o que você escreveu, ao lado */
.lembr{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;overflow:hidden}
.lembr summary{list-style:none;cursor:pointer;padding:15px 20px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;font-size:.92rem;font-weight:600;color:var(--ink)}
.lembr summary::-webkit-details-marker{display:none}
.lembr summary svg{width:15px;height:15px;color:var(--slate);transition:transform .2s}
.lembr[open] summary svg{transform:rotate(180deg)}
.lembr__b{padding:0 20px 18px;display:grid;gap:16px;max-height:420px;overflow-y:auto}
.lembr__q{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
.lembr__t{font-size:.92rem;color:var(--ink-70);line-height:1.6;margin-top:6px;white-space:pre-wrap}
/* a resposta escrita */
.rpfeito{background:linear-gradient(158deg,#1B1531,#131020);color:#EFE9FF;border-radius:var(--r-xl);
  padding:30px 34px;box-shadow:0 40px 90px -40px rgba(20,12,50,.55);position:relative;overflow:hidden}
@media(max-width:620px){ .rpfeito{padding:24px 22px} }
.rpfeito__f{position:absolute;inset:0;width:100%;height:100%;opacity:.45}
.rpfeito__f path{fill:none;stroke:rgba(190,168,255,.18);stroke-width:1}
.rpfeito__in{position:relative;z-index:2}
.rpfeito__k{font-family:var(--f-mono);font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--lilac)}
.rpfeito__t{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:400;
  font-size:clamp(20px,2.6vw,26px);line-height:1.4;margin:14px 0 0;color:#fff;white-space:pre-wrap}
.rpfeito__m{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.rpfeito__d{font-family:var(--f-mono);font-size:10px;color:#8E86A0}
.rpfeito__ed{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.2);
  border-radius:999px;background:rgba(255,255,255,.06);padding:6px 14px 6px 11px;font-size:.78rem;color:#EFE9FF}
.rpfeito__ed:hover{border-color:rgba(255,255,255,.45)}
.rpfeito__ed svg{width:12px;height:12px}
/* o que você leva */
.leva{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}
@media(max-width:760px){ .leva{grid-template-columns:1fr} }
.leva__c{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:22px 24px}
.leva__k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}
.leva__t{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.06rem;margin:9px 0 0}
.leva ol{counter-reset:l;list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.leva li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.9rem;color:var(--ink-70);line-height:1.5}
.leva li::before{counter-increment:l;content:counter(l);font-family:var(--f-mono);font-size:.68rem;color:var(--violet);
  background:var(--mist);border-radius:7px;display:grid;place-items:center;height:22px}
.leva li span{display:block;font-size:.76rem;color:var(--slate);margin-top:2px}
.leva__p{font-size:.92rem;color:var(--ink-70);line-height:1.6;margin:12px 0 0}
/* o que você leva daqui */
.lv{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:32px 34px 14px;color:#EFE9FF;
  background:radial-gradient(74% 92% at 70% 8%, rgba(122,92,214,.3), transparent 62%),
             linear-gradient(158deg,#141028,#1A1435 52%,#0C0917);
  border:1px solid rgba(255,255,255,.07);box-shadow:0 40px 90px -42px rgba(20,12,50,.55)}
@media(max-width:620px){ .lv{padding:24px 20px 8px} }
.lv__f{position:absolute;inset:0;width:100%;height:100%;opacity:.4}
.lv__f path{fill:none;stroke:rgba(190,168,255,.2);stroke-width:1}
.lv__in{position:relative;z-index:2}
.lv__h{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:400;
  font-size:clamp(22px,2.8vw,28px);line-height:1.2;margin:0;letter-spacing:-.014em;color:#fff}
.lv__s{font-size:.92rem;color:#C9C2E0;margin:9px 0 0;line-height:1.55}
.lv__i{display:grid;grid-template-columns:46px 1fr 18px;gap:17px;align-items:center;width:100%;text-align:left;
  padding:19px 0;border-top:1px solid rgba(255,255,255,.09);margin-top:20px}
.lv__i:not(:first-of-type){margin-top:0}
.lv__i:hover .lv__t{color:#fff}
.lv__i:hover .lv__ic{background:rgba(173,146,240,.26);border-color:rgba(173,146,240,.5)}
.lv__ic{width:46px;height:46px;border-radius:14px;background:rgba(173,146,240,.14);color:var(--lilac);
  border:1px solid rgba(173,146,240,.22);display:grid;place-items:center;transition:all .18s}
.lv__ic svg{width:19px;height:19px}
.lv__t{display:block;font-size:1.06rem;font-weight:600;color:#EFE9FF;line-height:1.25;transition:color .18s}
.lv__t--v{color:#fff}
.lv__d{display:block;font-size:.88rem;color:#A79FC0;margin-top:5px;line-height:1.5}
.lv__i>svg:last-child{width:17px;height:17px;color:#6E6689}
/* o resto do Signal, no padrão das portas */
.ab{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){ .ab{grid-template-columns:1fr} }
.ab__c{position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 26px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s}
.ab__c:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--lilac)}
.ab__ic{width:46px;height:46px;border-radius:14px;background:var(--mist);color:var(--violet);
  display:grid;place-items:center;margin-bottom:18px}
.ab__ic svg{width:20px;height:20px}
.ab__k{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.ab__t{display:block;font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;
  font-size:1.34rem;line-height:1.15;margin-top:7px;letter-spacing:-.01em;color:var(--ink)}
.ab__d{display:block;font-size:.9rem;color:var(--ink-70);margin-top:9px;line-height:1.55}
.ab__go{margin-top:auto;padding-top:20px;display:inline-flex;align-items:center;gap:8px;
  font-size:.82rem;font-weight:600;color:var(--violet)}
.ab__go svg{width:15px;height:15px;transition:transform .2s}
.ab__c:hover .ab__go svg{transform:translateX(3px)}
/* alternar o fundo da arte */
.artetg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--mist);border:1px solid var(--line)}
.artetg button{border-radius:999px;padding:7px 18px;font-size:.8rem;font-weight:600;color:var(--slate)}
.artetg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-1)}
.artenova{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:999px;
  background:#fff;padding:11px 20px 11px 16px;font-size:.84rem;font-weight:600;color:var(--ink-70)}
.artenova:hover{border-color:var(--lilac);background:var(--mist);color:var(--violet-dark)}
.artenova svg{width:15px;height:15px;transition:transform .5s var(--ease)}
.artenova:hover svg{transform:rotate(-180deg)}

/* a arte */
.arte{display:block;width:100%;max-width:340px;margin:0 auto;border-radius:16px;border:1px solid var(--line);
  box-shadow:var(--shadow-2)}
.artem .mt24{margin-top:30px}
.artem{width:min(460px,100%)}
.artem h3{font-size:1.26rem;margin:8px 0 6px}
.artesh{display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:14px}
.artesh>button{flex:1 1 74px;display:grid;justify-items:center;gap:7px;padding:8px 2px;border-radius:12px;color:var(--slate)}
.artesh>button:hover{background:var(--mist)}


/* ============================================================
   BLOCO 7 · pulsos, minha empresa, vozes
   ============================================================ */
/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:10px 8px;margin-top:22px;align-items:center}
.fg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--mist);border:1px solid var(--line)}
.fg button{border-radius:999px;padding:8px 15px;font-size:.8rem;font-weight:500;color:var(--slate);white-space:nowrap}
.fg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
/* barra de filtros compacta */
.fbar{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
  background:#fff;padding:11px 16px;font-size:.84rem;color:var(--ink-70);white-space:nowrap}
.fbtn:hover{border-color:var(--lilac);color:var(--violet-dark)}
.fbtn b{font-weight:600;color:var(--ink)}
.fbtn svg{width:14px;height:14px;color:var(--slate)}
.fbtn--on{border-color:var(--lilac);background:var(--mist)}
.fbtn--on b{color:var(--violet-dark)}
.fcount{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--slate);
  margin-left:auto;white-space:nowrap}
/* gaveta de recorte */
.rec{width:min(440px,100%)}
.rec h3{font-size:1.16rem;margin:6px 0 4px}
.rec__g{margin-top:20px}
.rec__k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--violet);
  display:flex;align-items:center;gap:10px}
.rec__k::after{content:'';flex:1;height:1px;background:var(--line)}
.rec__o{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.rec__o button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 15px;
  font-size:.82rem;color:var(--ink-70)}
.rec__o button:hover{border-color:var(--lilac)}
.rec__o button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.rec__n{font-size:.8rem;color:var(--slate);line-height:1.5;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}
.fbusca{position:relative;flex:1;min-width:190px}
.fbusca input{width:100%;border:1px solid var(--line);border-radius:999px;padding:11px 16px 11px 40px;
  font-size:.88rem;background:#fff}
.fbusca input:focus{outline:0;border-color:var(--lilac);box-shadow:0 0 0 3px var(--mist)}
.fbusca svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--slate)}
.fnota{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);
  width:100%;margin-top:2px}
/* a lista de pulsos */
.plista{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--shadow-1);overflow:hidden}
.plh{display:grid;grid-template-columns:1fr 128px 92px;gap:14px;padding:13px 24px;background:var(--paper-2);
  border-bottom:1px solid var(--line-soft);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate)}
.plh span:nth-child(2),.plh span:nth-child(3){text-align:right}
.pli{display:grid;grid-template-columns:1fr 128px 92px;gap:14px;align-items:center;width:100%;text-align:left;
  padding:16px 24px;border-top:1px solid var(--line-soft);transition:background .15s}
.pli:first-of-type{border-top:0}
.pli:hover{background:var(--mist)}
.pli__n{font-size:.98rem;font-weight:600;color:var(--ink);line-height:1.2}
.pli__p{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--slate);margin-top:4px}
.pli__h{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.pli__v{font-family:var(--f-mono);font-size:1rem;font-weight:500}
.pli__b{width:44px;height:5px;border-radius:999px;background:var(--line);overflow:hidden;flex:none}
.pli__b i{display:block;height:5px;border-radius:999px}
.pli__s{text-align:right;font-family:var(--f-mono);font-size:.84rem;color:var(--ink-70)}
.pli__s small{display:block;font-size:9px;color:var(--slate);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
@media(max-width:640px){
  .plh{display:none}
  .pli{grid-template-columns:1fr auto;gap:6px 12px;padding:15px 18px}
  .pli__h{grid-column:2;grid-row:1;justify-content:flex-end}
  .pli__s{grid-column:1/-1;grid-row:2;text-align:left;font-size:.78rem}
  .pli__s small{display:inline;margin:0 0 0 6px}
}
.pvazio{padding:40px 24px;text-align:center;color:var(--slate);font-size:.92rem}
.cx{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);
  padding:26px 28px;display:grid;gap:22px;margin-top:16px}
@media(max-width:620px){ .cx{padding:22px 20px;gap:18px} }
.cxb{display:grid;grid-template-columns:132px 1fr 48px;align-items:center;gap:14px}
.cxb__n{font-size:.96rem;font-weight:600;color:var(--ink);line-height:1.2}
.cxb__t{display:block;height:22px;background:var(--line-soft);border-radius:7px;overflow:hidden}
.cxb__f{display:block;height:100%;border-radius:7px;transition:width .9s var(--ease)}
.cxb__v{font-family:var(--f-mono);font-size:.92rem;font-weight:500;text-align:right}
.cxd{font-size:.86rem;color:var(--ink-70);line-height:1.5;margin:8px 0 0 146px;max-width:56ch}
@media(max-width:620px){
  .cxb{grid-template-columns:1fr 46px;gap:8px 12px}
  .cxb__n{grid-column:1;grid-row:1}
  .cxb__v{grid-column:2;grid-row:1}
  .cxb__t{grid-column:1/-1;grid-row:2}
  .cxd{margin:9px 0 0}
}
/* seções do detalhe, com respiro */
.sec{margin-top:46px}
.sec__h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec__k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--slate)}
.sec h2{margin:0}
.sec__p{font-size:.94rem;color:var(--ink-70);line-height:1.55;margin:10px 0 0;max-width:62ch}

/* o cartão do pulso, no detalhe */
.pd{border-radius:var(--r-xl);padding:30px 32px;color:#EFE9FF;position:relative;overflow:hidden;
  background:radial-gradient(72% 90% at 70% 10%, rgba(122,92,214,.3), transparent 62%),
             linear-gradient(158deg,#171227,#120E22 54%,#0C0918);
  border:1px solid rgba(255,255,255,.07);box-shadow:0 36px 80px -40px rgba(20,12,50,.55)}
@media(max-width:620px){ .pd{padding:24px 22px} }
.pd__t{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:10px}
.pd__n{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:500;font-size:clamp(22px,2.8vw,28px);color:#fff}
.pd__v{font-family:var(--f-display);font-variation-settings:'opsz' 96;font-weight:400;font-size:2.6rem;line-height:.9}
.pd__v small{font-family:var(--f-mono);font-size:.3em;color:#8E86A0;margin-left:2px}
.pd__d{font-size:.86rem;color:#C9C2E0;margin:8px 0 0}
.pd__f{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.09);
  font-size:.8rem;color:#9C94B4;display:flex;gap:10px;align-items:flex-start}
.pd__f svg{width:14px;height:14px;flex:none;margin-top:2px}
/* os dez pilares na lista */
.pl10{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--shadow-1);padding:10px 26px 18px;overflow:hidden}
.p10{display:grid;grid-template-columns:178px 1fr 54px;gap:18px;align-items:center;padding:14px 0;
  border-top:1px solid var(--line-soft)}
.p10:first-child{border-top:0}
.p10__n{display:flex;align-items:center;gap:9px;font-size:.94rem;color:var(--ink);min-width:0}
.p10__n i{width:9px;height:9px;border-radius:3px;flex:none}
.p10__n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p10__t{position:relative;height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.p10__t b{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .8s var(--ease)}
.p10__v{font-family:var(--f-mono);font-size:.92rem;font-weight:500;text-align:right}
@media(max-width:620px){
  .pl10{padding:8px 18px 14px}
  .p10{grid-template-columns:1fr 50px;gap:6px 12px;padding:13px 0}
  .p10__n{grid-column:1;grid-row:1}
  .p10__v{grid-column:2;grid-row:1}
  .p10__t{grid-column:1/-1;grid-row:2}
}
/* seletor de empresa */
.selemp{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.selemp button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 16px;text-align:left}
.selemp button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.selemp b{display:block;font-size:.92rem;font-weight:600}
.selemp span{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--slate);margin-top:4px}
.selemp button.on span{color:var(--lilac)}
/* vozes */
.vz{display:grid;gap:14px;margin-top:24px}
.vzi{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;background:#fff;
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-1);padding:24px 26px;
  transition:border-color .3s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.vzi:hover{border-color:var(--lilac);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.vzi--on{border-color:var(--lilac-soft);background:linear-gradient(160deg,var(--mist),#fff)}
.vzi__t{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;font-size:1.14rem;
  line-height:1.25;color:var(--ink);letter-spacing:-.008em}
.vzi__d{font-size:.9rem;color:var(--ink-70);margin-top:8px;line-height:1.55;max-width:62ch}
.vzi__m{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.res{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--lilac-soft);border-radius:999px;
  background:var(--mist);padding:9px 17px 9px 13px;font-size:.84rem;font-weight:600;color:var(--violet-dark);
  transition:all .2s}
.res svg{width:16px;height:16px}
.res:hover{border-color:var(--lilac);background:#EDE7FC}
.res.on:hover{background:var(--violet-dark)}
.res.on{background:var(--violet);border-color:var(--violet);color:#fff}
.res.on svg{filter:drop-shadow(0 0 5px rgba(255,255,255,.6))}
.res b{font-weight:600}
.vzi__n{font-family:var(--f-mono);font-size:.8rem;color:var(--slate)}
.vzi__n b{color:var(--ink);font-weight:500}
.vzi__p{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--slate)}
.vzi__b{flex:none;border:1px solid var(--line);border-radius:999px;background:#fff;padding:10px 18px;
  font-size:.82rem;font-weight:600;color:var(--ink-70);white-space:nowrap}
.vzi__b:hover{border-color:var(--lilac);color:var(--violet-dark);background:var(--mist)}
.vzi__b.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media(max-width:620px){ .vzi{grid-template-columns:1fr;gap:14px} .vzi__b{width:100%;text-align:center} }
/* painel de países */
.pais{width:min(460px,100%)}
.pais h3{font-size:1.18rem;margin:6px 0 14px}
.pais__b{max-height:min(52vh,420px);overflow-y:auto;margin-top:14px}
.pais__c{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--violet);
  margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.pais__c::after{content:'';flex:1;height:1px;background:var(--line)}
.pais__i{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  padding:11px 13px;border-radius:12px;font-size:.92rem;color:var(--ink)}
.pais__i:hover{background:var(--mist)}
.pais__i.on{background:var(--ink);color:#fff}
.pais__i span{font-family:var(--f-mono);font-size:10px;color:var(--slate)}
.pais__i.on span{color:var(--lilac)}


/* ============================================================
   BLOCO 8 · conta e relatório
   ============================================================ */
.ct{display:grid;gap:16px;margin-top:26px}
.ctc{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-1);padding:8px 26px 18px}
@media(max-width:620px){ .ctc{padding:6px 18px 14px} }
.ctc__k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--violet);
  padding:18px 0 4px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 0;
  border-top:1px solid var(--line-soft)}
.ctl__t{font-size:.95rem;color:var(--ink);font-weight:500}
.ctl__d{display:block;font-size:.84rem;color:var(--ink-70);margin-top:4px;line-height:1.5;max-width:56ch}
.ctl__a{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 16px;font-size:.8rem;
  font-weight:600;color:var(--violet-dark);white-space:nowrap}
.ctl__a:hover{border-color:var(--lilac);background:var(--mist)}
.ctl__a--q{border-color:transparent;color:var(--slate)}
.ctl__a--q:hover{color:var(--ink);background:var(--mist);border-color:transparent}
/* medidores do plano */
.med{display:grid;gap:14px;padding:16px 0;border-top:1px solid var(--line-soft)}
.med__i{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center}
.med__n{font-size:.88rem;color:var(--ink-70)}
.med__v{font-family:var(--f-mono);font-size:.84rem;text-align:right;color:var(--ink)}
.med__b{grid-column:1/-1;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.med__b i{display:block;height:5px;border-radius:999px;background:linear-gradient(90deg,var(--lilac),var(--violet))}
/* lista de sinais na conta */
.cts{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:15px 0;
  border-top:1px solid var(--line-soft)}
.cts__n{font-size:.95rem;font-weight:600;color:var(--ink)}
.cts__d{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--slate);margin-top:4px}
.cts__e{font-size:.8rem;color:var(--slate);text-align:right}
.cts__x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--slate)}
.cts__x:hover{background:rgba(210,86,90,.1);color:var(--risk)}
.cts__x svg{width:15px;height:15px}
/* área perigosa */
.perigo{border-color:rgba(210,86,90,.3)}
.perigo .ctc__k{color:var(--risk-texto)}
.perigo .ctl__a{color:var(--risk-texto);border-color:rgba(210,86,90,.3)}
.perigo .ctl__a:hover{background:rgba(210,86,90,.08);border-color:var(--risk)}

/* ============================================================
   CARTÕES E CAMPOS
   ============================================================ */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:22px}
.k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.k--v{font-size:11.5px;letter-spacing:.17em;color:var(--violet)}
.field{display:grid;gap:7px}
.field label{font-size:.72rem;font-weight:600;color:var(--ink-70);letter-spacing:.02em}
.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;font-size:.95rem}
.field input:focus{outline:0;border-color:var(--lilac);box-shadow:0 0 0 3px var(--mist)}
.field input::placeholder{color:var(--slate-40)}
.gbtn--ok{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);
  font:inherit;font-size:14px;color:var(--ink)}
/* o toque duplo dava zoom sem querer enquanto a pessoa respondia. Desligar o
   gesto nos alvos de toque preserva o zoom por pinça da página. */
.opt, .opt *, .btn, .caixao, .ni, .tb, .res, .vzi__b, .est, .pchip{touch-action:manipulation}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);
  border-radius:999px;background:#fff;padding:13px 20px;font-weight:600;font-size:.9rem}
.gbtn:hover{border-color:var(--lilac);background:var(--mist)}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--slate);font-size:.76rem;margin:14px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

/* ============================================================
   QUESTIONÁRIO (seção 2)
   ============================================================ */
.qhead{position:fixed;top:var(--top);left:0;right:0;z-index:50;background:var(--bg);padding:12px 0 10px}
.qhead__in{max-width:740px;margin:0 auto;padding:0 20px}
.rails{display:grid;grid-template-columns:1fr 3fr;gap:10px;align-items:center}
.rail{height:4px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.rail i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--lilac),var(--violet));
  transition:width .45s cubic-bezier(.3,.8,.3,1)}
.rail--off i{background:var(--line-2)}
.rail__l{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:.8rem;color:var(--slate)}
.rail__l b{color:var(--ink);font-weight:600}
.rail__l .qual{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.rail__l{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;font-size:.8rem;color:var(--slate)}
.rail__l b{color:var(--ink);font-weight:600}
.q{padding-top:calc(var(--top) + 78px)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:26px}
.qnote{font-size:.85rem;color:var(--slate);padding:13px 16px;background:var(--mist);border-radius:var(--r-md);margin-bottom:20px;max-width:60ch}
.qk{display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 11px;border-radius:999px;
  background:var(--mist);color:var(--violet-dark);font-size:.72rem;font-weight:600;margin-bottom:13px}
.qk i{width:7px;height:7px;border-radius:50%;background:currentColor}
.qt{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;
  font-size:clamp(23px,3.2vw,30px);line-height:1.22;margin:0;letter-spacing:-.008em}
.qa{font-size:.86rem;color:var(--slate);margin:10px 0 0;max-width:52ch}
.opts{display:grid;gap:9px;margin-top:20px}
.opt{display:grid;grid-template-columns:32px 1fr;align-items:center;gap:12px;text-align:left;
  padding:13px 15px 13px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;
  font-size:.92rem;line-height:1.34;transition:border-color .14s,background .14s}
.opt:hover{border-color:var(--lilac);background:var(--mist)}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.opt kbd{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:var(--mist);
  border:1px solid var(--line);font-family:var(--f-mono);font-size:.66rem;color:var(--slate)}
.opt[aria-checked="true"] kbd{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.opt b{font-weight:600}
.opt__l{font-weight:400}
/* escala de concordância: só o número recebe a tinta, do verde ao vermelho */
.opt--t1 kbd{background:rgba(62,158,134,.18);border-color:rgba(62,158,134,.38);color:#2E7A66}
.opt--t2 kbd{background:rgba(62,158,134,.09);border-color:rgba(62,158,134,.22);color:#3E9E86}
/* o meio da escala é neutro, não lilás: o lilás é a cor de destaque do
   produto e puxava o olho para a alternativa do meio */
.opt--t3 kbd{background:rgba(217,164,65,.14);border-color:rgba(217,164,65,.32);color:#A87A21}
.opt--t4 kbd{background:rgba(210,86,90,.09);border-color:rgba(210,86,90,.22);color:#C4595D}
.opt--t5 kbd{background:rgba(210,86,90,.16);border-color:rgba(210,86,90,.38);color:#B0484C}
.opt small{display:block;font-size:.76rem;opacity:.72;margin-top:2px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.qhint{font-size:.72rem;color:var(--slate)}
@media(max-width:620px){ .qhint{display:none} .qcard{padding:20px} }

/* ============================================================
   E-MAIL E APURAÇÃO · no padrão da intro da 189
   ============================================================ */
.intro--claro{background:var(--paper)}
.intro__inner--estreito{max-width:560px;justify-content:center}
.intro__inner--centro{align-items:center;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--violet);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stack{display:grid;gap:24px;justify-items:center}
.oudiv{position:relative;text-align:center;margin:14px 0}
.oudiv::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.oudiv span{position:relative;background:#fff;padding:0 12px;font-size:.76rem;color:var(--slate)}

/* ============================================================
   POLÍTICAS (seção 1)
   ============================================================ */
.pol{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;overflow:hidden;margin-top:20px}
.pol details{border-top:1px solid var(--line-soft)}
.pol details:first-child{border-top:0}
.pol summary{list-style:none;cursor:pointer;padding:17px 22px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;font-weight:600;font-size:.95rem}
.pol summary::-webkit-details-marker{display:none}
.pol summary svg{width:15px;height:15px;color:var(--slate);transition:transform .2s}
.pol details[open] summary svg{transform:rotate(180deg)}
.pol__b{padding:0 22px 20px;color:var(--ink-70);font-size:.9rem;line-height:1.62}
.pol__b p{margin:0 0 10px}
.pol__b b{color:var(--ink)}

/* ============================================================
   MODAL E AVISO
   ============================================================ */
.modal{position:fixed;inset:0;z-index:150;display:none;place-items:center;padding:20px;
  background:rgba(20,18,28,.42);backdrop-filter:blur(3px)}
.modal.on{display:grid}
.modal__b{width:min(440px,100%);background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-2);
  padding:26px;animation:pop .28s var(--ease) both;max-height:88vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.stripefield{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--f-mono);
  font-size:13px;color:var(--slate);background:var(--paper-2);display:flex;justify-content:space-between;
  align-items:center;gap:10px}
.stripefield__i{flex:1;min-width:0;background:none;border:0;outline:none;text-align:right;
  font-family:var(--f-mono);font-size:13px;color:var(--ink);letter-spacing:.06em}
.stripefield__i::placeholder{color:var(--slate-40)}
.pw{text-align:center}
.pw .lockup{font-size:26px;color:var(--violet);justify-content:center;display:inline-flex}
.pw h3{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;font-size:1.3rem;margin:14px 0 8px}
.pw__lin{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:24px;
  padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
.pw__v{font-family:var(--f-mono);font-size:1.16rem;font-weight:500}
.pw__campos{display:grid;gap:8px;margin-top:16px;text-align:left}
.pw__campos .row{display:flex;gap:8px}
.pw__campos .row .stripefield{flex:1}
.pw .btn{width:100%}
.pwload{text-align:center;padding:20px 0}
.pwload .spin{margin:0 auto}
.pwload p{margin-top:16px;font-size:.88rem;color:var(--slate)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);z-index:180;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:.85rem;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* provisório do bloco 1 */
.soon{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:26px;background:#fff;text-align:left}
.soon h3{margin-bottom:8px}
/* ---------- setores (21/09) ---------- */
.pli--forma{cursor:default;opacity:1}
.pli__forma{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.04em;color:var(--slate)}
.busca__q{font-size:.86rem;color:var(--slate);margin:4px 2px 8px}
.busca__ok{font-family:var(--f-mono);font-size:.84rem;color:var(--slate)}
.cmp{display:flex;gap:24px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper-2);font-size:.95rem;color:var(--ink-70)}
.cmp b{color:var(--ink);font-weight:600}
/* ---------- políticas e consentimento (21/09) ---------- */
.pol__v{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em;color:var(--slate);margin-bottom:12px}
.consent{margin-top:20px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper-2)}
/* ---------- a marca endossada: "signal" grande, "by Vocalis" embaixo (21/09) ---------- */
.lockup__txt{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1}
.byline{font-family:var(--f-mono);font-size:.4em;font-weight:400;letter-spacing:.12em;color:var(--slate);margin-top:.3em;white-space:nowrap}
.trans__lg .byline{color:rgba(244,241,255,.82)}
.top .lockup .byline{font-size:.46em}
.mpop .mpop__tm{font-size:.78rem;line-height:1.5;color:var(--slate);margin-top:14px}
/* o aviso do Somar, agora sobre fundo claro (a classe .pulso__f era do cartão escuro) */
.somar__nota{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--slate);margin:0}
.somar__nota svg{width:14px;height:14px;flex:none;margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Dialog" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   SIGNAL M2 · bloco 1 · núcleo
   ============================================================ */
const CORPUS = {
 "versao": "Signal_Corpus_v1_1",
 "jornadas": [
  "A",
  "B",
  "C",
  "D",
  "E",
  "Z"
 ],
 "pilares": {
  "integridade": {
   "nome": "Integrity",
   "grupo": "Coesao",
   "cor": "#544A8C",
   "posicao": "centro-1",
   "essencia": "Truth circulating at no cost, and the company growing without ceasing to be itself.",
   "facetas": [
    {
     "id": "q18",
     "camada": "lider",
     "pergunta": "I believe it is always easy to tell the truth here.",
     "abertura": {
      "severo": "It is not safe to tell the truth here, and everyone has learned the version of what can and cannot be said out loud.",
      "moderado": "Telling the truth costs something here, so much of what matters goes unsaid."
     }
    },
    {
     "id": "q19",
     "camada": "org",
     "pergunta": "The company can grow without ceasing to be what it is.",
     "abertura": {
      "severo": "The company drifted from what it said it was, and growth came at the cost of what it used to be.",
      "moderado": "With every step of growth, the company looks a little less like what it always was."
     }
    }
   ],
   "high": {
    "harmonico": "What is said and what is done usually match. When they do not, someone names it instead of pretending not to see.",
    "integro": "Words and practice travel together, even when it costs. You can trust what is said here, and that saves the energy distrust consumes."
   },
   "jornadas": {
    "A": {
     "rotulos": [
      "where the business gains",
      "where it loses strength"
     ],
     "alcance": {
      "dentro": [
       "Deadline, price and promise kept, building reputation.",
       "A word worth more than a contract.",

function wave(x0,x1,y,amp,freq,phase,steps){
  steps = steps || 90; let d='';
  for(let i=0;i<=steps;i++){
    const t=i/steps, x=x0+(x1-x0)*t, env=Math.sin(Math.PI*t);
    const yy=y+Math.sin(t*Math.PI*2*freq+phase)*amp*(0.35+0.65*env);
    d += (i?'L':'M')+x.toFixed(1)+' '+yy.toFixed(2);
  }
  return d;
}
const ALVO = [0,1,2,3].map(i=>({amp:(14+i*12)+1.2, frq:(1.0+i*0.55), y:190+i*30, ph:i*1.9,
  col: i===1?'#AD92F0':(i===2?'#C4B2F4':'#D6CBF8'), sw:1.5-i*0.22, op:0.72-i*0.12}));
const CAOS = Array.from({length:7},(_,i)=>({amp:30+(i%4)*17, frq:3.4+i*2.2+(i%3)*1.4, y:212+(i-3)*27, ph:i*1.37}));

function bootPath(y,amp,frq,ph,jit,i,t){
  const x0=-40,x1=1240,steps=150; let d='';
  for(let k=0;k<=steps;k++){
    const u=k/steps, x=x0+(x1-x0)*u, env=Math.sin(Math.PI*u);
    const noise = jit ? jit*Math.sin(k*2.9+i*3.3+t/60) : 0;
    const yy = y + (Math.sin(u*Math.PI*2*frq+ph)*amp + noise)*(0.35+0.65*env);
    d += (k?'L':'M')+x.toFixed(1)+' '+yy.toFixed(2);

  return d;
}

function perguntaDe(r){ return (SINAL.pergunta[r.jornada]||{})[r.estado.k] || ''; }
const LIM_TENSAO = 67;
function fraseCamadas(r){
  const de = SINAL.de[r.jornada] || SINAL.de.C;
  const L = [{v:r.camadas.org,n:de[0]},{v:r.camadas.lider,n:de[1]},{v:r.camadas.indiv,n:de[2]}]
            .sort((a,b)=>a.v-b.v);                       /* menor nota = mais pressão */
  const espalha = L[2].v - L[0].v;
  if(espalha < 8)
    return 'The pressure is split between '+L[0].n.replace(/^d[aoe]s? /,'')+', '+
           L[1].n.replace(/^d[aoe]s? /,'')+' and '+L[2].n.replace(/^d[aoe]s? /,'')+', with no side weighing much more.';
  if(L[1].v - L[0].v < 8)
    return 'The pressure comes more from '+L[0].n+' and from '+L[1].n+', and less from '+L[2].n+'.';
  return 'The pressure comes more from '+L[0].n+', and less from '+L[1].n+' and '+L[2].n+'.';
}
function textoCamadas(r){ return (SINAL.camadas[r.jornada]||SINAL.camadas.C)[padraoCamadas(r.camadas)] || ''; }
function padraoCamadas(c){
  const b = k => c[k] < LIM_TENSAO;
  const o=b('org'), l=b('lider'), i=b('indiv');
  if(o&&l&&i) return 'todas';
  if(o&&l) return 'orgLider';
  if(o&&i) return 'orgIndiv';
  if(l&&i) return 'liderIndiv';
  if(o) return 'org'; if(l) return 'lider'; if(i) return 'indiv';
  return 'nenhuma';
}
function ondaH(W,H,amp,freq,phase,y){
  let d=''; const steps=90;
  for(let i=0;i<=steps;i++){
    const t=i/steps, x=W*t, env=Math.sin(Math.PI*t);
    const yy=y+Math.sin(t*Math.PI*2*freq+phase)*amp*(0.4+0.6*env);
    d += (i?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1);
  }
  return d;
}

  const P = CORPUS.pilares[k], v = r.pilares[k], J = r.jornada, jd = P.jornadas[J] || P.jornadas.C;
  if(v >= 89) return P.high.integro;

  return abertura + (custo ? ' ' + custo : '');

}

/* ---------- a abertura, v10: composição em tempos ---------- */
function tocarAbertura(){
  const svg=$('#obSvg'); if(!svg) return fimAbertura();
  const paths=Array.from({length:7},(_,i)=>$('#ob'+i));
  const root=$('.intro'), panel=$('#introPanel');
  const kids = panel ? Array.from(panel.children) : [];

  /* ordem da composição: identidade, marcador, afirmação, corpo, ação, moldura */
  const beats=[]; const push=(el,ms)=>{ if(el) beats.push({el,ms,feito:false}); };
  push($('#introBrand'), 0);
  kids.forEach((k,n)=>push(k, 420 + n*440));
  const fim = 420 + Math.max(0, kids.length-1)*440;
  push($('.introTag'), fim+460);
  push($('.intro__foot'), fim+460);

  /* 0,5s mais curta no escuro: quem chega pela primeira vez não pensa que
     travou. A ordem dos tempos é a mesma, só antecipada. */
  const T={conv:[300,3300], beat:[1400,2800], reveal:3700};
  const T_END = T.reveal + fim + 460 + 1100;
  const t0=performance.now(); let last=t0, noisePh=0, driftPh=0, raf;

  function frame(now){
    const t=now-t0, dt=Math.min(50, now-last); last=now;
    const cv=ease01((t-T.conv[0])/(T.conv[1]-T.conv[0]));
    /* o ruído mantém a velocidade inicial e vai desacelerando com a suavização */
    noisePh += dt/(58 + cv*820);
    driftPh += dt/(900 + cv*3000);
    const bw=Math.min(1,Math.max(0,(t-T.beat[0])/600))*Math.max(0,1-Math.max(0,(t-T.beat[1])/400));
    const pulse=1+0.19*Math.sin(t/1000*Math.PI*2*1.1)*bw, jit=(1-cv)*11;
    for(let i=0;i<7;i++){
      const c=CAOS[i], keep=i<4, a=keep?ALVO[i]:null;
      const amp=keep?lerp(c.amp,a.amp,cv)*pulse:c.amp*(1-cv)*pulse;
      const frq=keep?lerp(c.frq,a.frq,cv):lerp(c.frq,1.6,cv);
      const y=keep?lerp(c.y,a.y,cv):lerp(c.y,235,cv);
      const ph=keep?lerp(c.ph+driftPh,a.ph,cv):c.ph+driftPh;
      paths[i].setAttribute('d', bootPath(y,amp,frq,ph,jit,i,noisePh));
      paths[i].setAttribute('opacity',(keep?lerp(0.5,a.op,cv):0.42*(1-cv)).toFixed(3));
      paths[i].setAttribute('stroke-width',(keep?lerp(1.1,a.sw,cv):1).toFixed(2));
    }
    if(t>=T.reveal){
      const r=t-T.reveal;
      beats.forEach(b=>{ if(!b.feito && r>=b.ms){ b.feito=true; b.el.classList.add('rv'); } });
    }
    if(t>=T_END){ aterrissar(); return; }
    raf=requestAnimationFrame(frame);
  }
  function aterrissar(){
    cancelAnimationFrame(raf);
    const rootNow=$('.intro')||root, panelNow=$('#introPanel')||panel;
    Array.from({length:4},(_,i)=>$('#ob'+i)).forEach((p,i)=>{
      if(p) p.setAttribute('d', wave(-40,1240,ALVO[i].y,ALVO[i].amp,ALVO[i].frq,ALVO[i].ph,150));
    });
    for(let i=4;i<7;i++){ const p=$('#ob'+i); if(p) p.setAttribute('opacity','0'); }
    rootNow.classList.remove('intro--boot');
    if(panelNow) panelNow.style.animation='';
    const sk=$('#opSkip'); if(sk) sk.remove();
    S._boot=false; save();
  }
  S._parar = () => { cancelAnimationFrame(raf); };
  raf=requestAnimationFrame(frame);
}
function fimAbertura(){ S._boot=false; render(); }

  const reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* A faixa de retomada diz onde a pessoa parou e dá o caminho de volta. Ela
   cobre todos os pontos de parada, não só o diário, e mostra um de cada vez,
   na ordem em que o produto quer que a pessoa siga. */
function faixaRetoma(){
  const r = S.result; if(!r || !S.pago) return '';
  const faixa = (txt, acao, rot, valor) =>
    '<div class="retoma"><span class="retoma__t">'+txt+'</span>'+

  /* 1 · a separação, que é o primeiro exercício */
  const p1 = progressoEx1();
  if(!p1.ok && p1.feitos > 0)
    return faixa('You stopped in the separation, on pillar <b>'+(p1.feitos+1)+' of '+p1.total+'</b>.', 'ir', 'Continue', 'separar');

  /* 2 · o diário */
  const feitas = respondidas(r), total = todasPerguntas(r).length;
  if(p1.ok && feitas > 0 && feitas < total){
    const prox = proximaPergunta(r);
    return faixa('You stopped at step <b>'+prox.p.ordem+' of 5</b> of the journal, in '+esc(prox.p.titulo)+'.', 'irDiario', 'Continue');
  }
  /* 3 · a resposta, que fecha o exercício */
  if(p1.ok && feitas === total && !S.respondido)
    return faixa('The ten questions are answered. What remains is to write <b>your answer</b>.', 'ir', 'Write', 'resposta');

  /* 4 · o sinal que nunca foi somado: sem isso, Pulsos fica trancado */
  if(!S.somado)
    return faixa('Your signal has <b>not been added</b> yet. Without it, the World Pulses stay closed.', 'ir', 'Add now', 'somar');

  return '';
}

const DIM_RISCO = { 'Action':'losing touch with reality',
                    'Structure':'drifting into chaos',
                    'Cohesion':'distorting its own meaning' };
const SEV = {'Risk of Rupture':'extremely high','Acute Crisis':'very high','Crisis':'high',
             'Tension':'medium','Harmonic':'low','Whole':'very low'};
function fraseSintese(r){
  /* DIM_RISCO é indexado pelo nome curto, sem o prefixo "Pilares de" */
  const dims = GRUPOS.map(([nome,,ks])=>({nome:nome.replace('Pillars of ',''), v:r0(avg(ks.map(k=>r.pilares[k])))}));
  const pior = dims.slice().sort((a,b)=>a.v-b.v)[0];
  const sev = SEV[stateFor(pior.v).n] || 'high';
  const tres = pilaresSeparar(r).map(k=>CORPUS.pilares[k].nome.toLowerCase());
  const lista = tres.length > 1 ? tres.slice(0,-1).join(', ')+' and '+tres[tres.length-1] : tres[0];
  const nenhumEmTensao = Object.keys(r.pilares).every(k => r.pilares[k] >= LIM_TENSAO);
  if(nenhumEmTensao)
    return 'No pillar is under tension today. <em>'+lista+'</em> is the closest to asking for attention, '+
           'and it is where the company gains most if it wants to go further.';
  const alvo = tres.length > 1 ? 'its pillars of ' : 'its pillar of ';
  return 'The company runs a <em>'+sev+'</em> of '+DIM_RISCO[pior.nome]+
         ' if it does not tune '+alvo+lista+'.';
}

function passosDiario(r){
  const J = r.jornada;
  return DIARIO.passos_ativos.map(p=>({
    id:p.id, ordem:p.ordem, titulo:p.titulo, proposito:p.proposito,
    perguntas:(p.perguntas_por_jornada[J] || p.perguntas_por_jornada.C)
  }));
}
function todasPerguntas(r){
  const out=[]; passosDiario(r).forEach(p=>p.perguntas.forEach(q=>out.push({p:p, q:q})));
  return out;
}
function respondidas(r){ return todasPerguntas(r).filter(x=>(S.diario[x.q.id]||'').trim()).length; }
function passoFechado(p){ return p.perguntas.every(q=>(S.diario[q.id]||'').trim()); }
/* a próxima pergunta aberta, respeitando a ordem dentro do passo e entre passos */
function proximaPergunta(r){
  const ps = passosDiario(r);
  for(const p of ps){
    for(const q of p.perguntas){ if(!(S.diario[q.id]||'').trim()) return {p:p, q:q}; }
  }
  return null;
}
function hojeBr(){
  const d=new Date(), M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return d.getDate()+' of '+M[d.getMonth()];
}
/* a data de criação de um sinal é gravada já formatada ("21 de set"), mas
   sinais antigos podem trazê-la como número: aceitar as duas formas evita o
   "NaN de undefined" que o seletor mostraria (encontrado em 21/09) */
function dataSinal(v){ return (typeof v === 'number') ? dataBr(v) : (v || 'today'); }
function dataBr(ts){
  const d = new Date(ts), M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h24 = d.getHours(), ampm = h24 < 12 ? 'AM' : 'PM', h12 = (h24 % 12) || 12;
  return M[d.getMonth()]+' '+d.getDate()+', '+h12+':'+String(d.getMinutes()).padStart(2,'0')+' '+ampm;
}

function chaveEmp(n){
  return (n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/\b(ltda|sa|s\.a\.|me|eireli|inc|llc|corp|co)\b/g,'').replace(/[^a-z0-9]/g,'');
}
/* aceita quase tudo, mas barra o que claramente não é nome de empresa */
function nomeValido(n){
  const t = (n||'').trim();
  if(t.length < 2 || t.length > 60) return false;
  const letras = (t.match(/[a-zA-Zà-úÀ-Ú]/g) || []).length;
  if(letras < 1) return false;
  if(letras < 2 && !/\d/.test(t)) return false;
  if(/(.)\1{3,}/.test(t)) return false;
  const vogais = (t.match(/[aeiouàáâãéêíóôõúAEIOUÀÁÂÃÉÊÍÓÔÕÚ]/g) || []).length;
  if(vogais === 0 && letras > 4) return false;
  if(/^[^a-zA-Zà-úÀ-Ú]+$/.test(t)) return false;
  return true;
}
function achaEmp(k){
  const pre = EMPRESAS.filter(e=>e.k.indexOf(k)===0);
  const meio = EMPRESAS.filter(e=>e.k.indexOf(k)>0);
  return pre.concat(meio).slice(0,5);
}
function empDe(k){ return EMPRESAS.find(e=>e.k===k) || null; }

/* Com mais de um sinal, o diário precisa dizer de quem ele é: ele mostra
   sempre o sinal ATIVO, e a barra abaixo nomeia a empresa e abre a troca. */
function barraDoSinal(){
  const outros = (S.sinais||[]).length;
  if(!outros) return '';
  const quando = S.criadoEm ? new Date(S.criadoEm).toLocaleDateString('en-US') : 'today';
  return '<div class="bsin">'+
    '<span class="bsin__t">Journal of <b>'+esc(S.empresa || 'company not identified')+'</b>'+
    '<span class="bsin__d"> · signal for '+quando+'</span></span>'+
    '<button class="btn btn--q btn--sm" data-a="ir" data-v="sala">Trocar de sinal</button>'+
  '</div>';
}
/* consentimento específico para o texto livre, pedido na primeira vez que a
   pessoa abre o diário ou o Assistente, o que vier primeiro (21/09, LGPD
   art. 11 e GDPR art. 9) */
const TEXTO_CONSENTIMENTO = 'What you write here may include information about your emotional health. You authorize Signal to store and use this content only to provide the service to you. It never enters the aggregated numbers, and you can delete it whenever you want.';
function caixaConsentimento(){
  return '<div class="consent"><p class="body">'+TEXTO_CONSENTIMENTO+'</p>'+
    '<label class="termos mt16"><input type="checkbox" id="ckTexto"> <span>I authorize</span></label>'+
    '<div class="mt16"><button class="btn btn--p btn--sm" data-a="consentirTexto">Continue'+I.seta+'</button></div></div>';
}
R.diario = () => {
  const r = S.result;
  if(r && !S.consentiuTexto) return '<section class="screen"><div class="wrap wrap--estreito">'+
    barraDoSinal()+
    '<span class="k k--v">Before you write</span>'+
    '<h2 class="mt12" style="max-width:26ch">What you write here is yours.</h2>'+
    caixaConsentimento()+
  '</div></section>';
  /* sinal novo, ainda sem avaliação: explicar, em vez de cair na home sem
     dizer nada. Com a conta aberta, o menu do diário fica clicável sempre. */
  if(!r) return '<section class="screen"><div class="wrap wrap--estreito">'+
    barraDoSinal()+
    '<span class="k k--v">Journal</span>'+
    '<h2 class="mt12" style="max-width:26ch">This signal has not been assessed yet.</h2>'+
    '<p class="body mt16" style="max-width:52ch">The journal is born from your reading: it uses your score, your pillars and the question of this signal. '+
    ((S.sinais||[]).length ? 'If you want to continue a journal you already started, switch signals above.' : 'Answer the assessment to begin.')+'</p>'+
    '<div class="row mt24"><button class="btn btn--p" data-a="'+((S.sinais||[]).length?'ir':'comecar')+'" data-v="sala">'+
      ((S.sinais||[]).length ? 'See my signals' : 'Start the assessment')+I.seta+'</button></div>'+
  '</div></section>';
  /* menu aberto pela conta, mas o sinal da vez ainda sem relatório: explicar em
     vez de mostrar um diário vazio */
  if(!S.pago) return '<section class="screen"><div class="wrap wrap--estreito">'+
    barraDoSinal()+
    '<span class="k k--v">Journal</span>'+
    '<h2 class="mt12" style="max-width:26ch">This signal has no report unlocked yet.</h2>'+
    '<p class="body mt16" style="max-width:52ch">The journal is born from the report: it uses your score, your pillars and the question of this signal. '+
    ((S.sinais||[]).length ? 'If you want to continue a journal you already started, switch signals above.' : '')+'</p>'+
    '<div class="row mt24"><button class="btn btn--p" data-a="ir" data-v="sinal">See this signal'+I.seta+'</button></div>'+
  '</div></section>';
  const ps = passosDiario(r), prox = proximaPergunta(r);
  const total = todasPerguntas(r).length, feitas = respondidas(r);
  const passoAtual = prox ? prox.p.id : ps[ps.length-1].id;
  const marca = '<span class="mark"></span>';
  let liberou = true;

  const chips = ps.map(p=>{
    const ok = passoFechado(p), aqui = p.id===passoAtual;
    const aberto = ok || aqui;
    const cls = aqui ? ' on' : (ok ? ' ok' : (aberto ? '' : ' lk'));
    return '<button class="pchip'+cls+'" data-a="irPasso" data-v="'+p.id+'">'+
      (ok ? I.check : (aberto ? '<b>'+p.ordem+'</b>' : I.lock))+p.titulo+'</button>';
  }).join('');

  let corpo='', travou=false;
  ps.forEach(p=>{
    const abriu = p.perguntas.some(q=>(S.diario[q.id]||'').trim()) || (prox && prox.p.id===p.id);
    if(!abriu){
      if(!travou){ travou=true;
        corpo += '<div class="tl__lock" id="p_'+p.id+'"><i>'+I.lock+'</i><div>'+
          '<b>'+p.titulo+'</b><span>Opens when you finish the previous step.</span></div></div>';
      }
      return;
    }
    corpo += '<div id="p_'+p.id+'">';
    p.perguntas.forEach((q, iq)=>{
      const resp = (S.diario[q.id]||'').trim();
      const editando = S.editando === q.id;
      const ehProx = prox && prox.q.id === q.id;
      if(!resp && !ehProx) return;
      const feito = resp && !editando;
      corpo += '<div class="msg'+(feito?' msg--ok':'')+'" id="q_'+q.id+'">'+
        '<span class="av'+(feito?'':' av--ask')+'">'+marca+'</span>'+
        '<div><span class="msg__k">'+esc(p.titulo)+' · question '+(iq+1)+' of '+p.perguntas.length+'</span>'+
        '<div class="msg__b"><p class="msg__t">'+esc(q.pergunta)+'</p>'+
        (q.apoio && !feito ? '<p class="msg__a">'+esc(q.apoio)+'</p>' : '')+'</div>';
      if(feito){
        corpo += '<div class="eu"><div class="eu__b">'+esc(resp)+'</div>'+
          '<div class="eu__meta"><span class="eu__data">'+dataBr(S.diarioEm[q.id]||Date.now())+'</span>'+
          (S.diarioEd[q.id] ? '<span class="editado">editado</span>' : '')+
          '<button class="eu__ed" data-a="editar" data-v="'+q.id+'">'+I.lapis+'Edit</button></div></div>';
      } else {
        corpo += '<div class="escreve"><textarea id="dtx" placeholder="Write it in your own words. It does not need to be polished.">'+esc(S.rascunho||resp||'')+'</textarea>'+
          '<div class="escreve__r"><span class="escreve__dica">Ctrl + Enter guarda e segue</span>'+
          '<span class="escreve__b">'+
            (editando ? '<button class="btn btn--q" data-a="cancelarEd">Cancel</button>' : '')+
            '<button class="btn btn--g btn--sm" data-a="assistente">'+I.chat+'Assistant</button>'+
            '<button class="btn btn--p btn--sm" data-a="guardar" data-v="'+q.id+'">'+(editando?'Save':'Send')+I.seta+'</button>'+
          '</span></div></div>';
      }
      corpo += '</div></div>';
    });
    corpo += '</div>';
  });

  const fim = !prox;
  return '<section class="screen" style="padding-top:calc(var(--top) + 6px);padding-bottom:0">'+
    barraDoSinal()+
    '<div class="dtopo"><div class="dtopo__in">'+
      '<div class="dtopo__c">'+
        '<div><p class="dtopo__k">'+(S.empresa ? 'your signal for '+esc(S.empresa) : 'the question of your signal')+'</p>'+
        '<p class="dtopo__q">'+esc(perguntaDe(r))+'</p></div>'+
        '<div class="dprog">'+
          '<div class="dprog__t"><b>'+feitas+'</b> of '+total+' answered</div>'+
          '<div class="dprog__b"><i style="width:'+(feitas/total*100).toFixed(1)+'%"></i></div>'+
          '<button class="btn btn--q dprog__s" data-a="sairDiario">Leave and continue later</button>'+
        '</div>'+
      '</div>'+
      '<div class="passos">'+chips+'</div>'+
    '</div></div>'+
    '<div class="tl">'+
      (feitas===0 ? '<div class="tl__abre"><span class="av">'+marca+'</span>'+
        '<p>The journal is where the decision happens. Ten questions, in five steps, answered one at a time. '+
        'You can leave and come back whenever you like, and edit what you have written. Your answers stay saved here. '+
        'If you get stuck on a question, the assistant is right beside you.</p></div>' : '')+
      corpo+
      (fim ? '<div class="passo1 mt32" style="border-color:var(--lilac-soft);background:#fff">'+
        '<span class="passo1__n" style="background:var(--mist);color:var(--violet)">'+I.check+'</span>'+
        '<span><span class="passo1__t">The ten questions are answered.</span>'+
        '<span class="passo1__d">Now it is your turn to answer the question that started all this.</span></span>'+
        '<span class="passo1__s"></span></div>'+
        '<div class="rodape2 mt24"><span class="rodape2__q">'+
          '<button class="btn btn--q" data-a="ir" data-v="meio">'+I.volta+'Back</button></span>'+
          '<button class="btn btn--p" data-a="irResposta">Write my answer'+I.seta+'</button></div>' : '')+
    '</div>'+
  '</section>'+fab();
};
/* ============================================================

function ondeParou(r){
  const prox = proximaPergunta(r);
  if(!prox) return { texto:'You answered the ten questions.', passo:null };
  return { texto:'You stopped at step '+prox.p.ordem+', <b>'+esc(prox.p.titulo)+'</b>.', passo:prox.p };
}
R.saiu = () => {
  const r = S.result; if(!r) return R.home();

    '<h2 class="mt16">You can come back whenever you like.</h2>'+

/* ============================================================
   A RESPOSTA

function perguntaPret(r){
  const m = SINAL.pergunta_preterito || {};
  return (m[r.jornada] && m[r.jornada][r.estado.k]) || perguntaDe(r);
}
/* a faixa de contexto: onde estou e como volto */
function ondeEstou(secao, passo, voltaRota, voltaTxt){
  return '<div class="onde">'+
    '<button class="onde__v" data-a="ir" data-v="'+voltaRota+'">'+I.volta+esc(voltaTxt)+'</button>'+
    '<span class="onde__t">'+esc(secao)+(passo ? ' <b>'+esc(passo)+'</b>' : '')+'</span>'+
  '</div>';
}
R.resposta = () => {
  const r = S.result; if(!r) return R.home();
  const escrita = (S.resposta||'').trim();
  const editando = S.editandoResp;
  const consigo = marcadasTodas(r);
  const escolhidas = S.acoes.length ? consigo.filter(x=>S.acoes.indexOf(x.k+'|'+x.n)>-1) : consigo.slice(0,3);
  /* a pergunta do diário que separa o que muda o jogo */
  const qJogo = todasPerguntas(r).find(x=>/muda o jogo|mudaria mesmo/i.test(x.q.pergunta));
  const jogo = qJogo ? (S.diario[qJogo.q.id]||'').trim() : '';

  /* o que a pessoa escreveu no diário, à mão */
  const lembrete = '<details class="lembr"><summary>What you wrote in the journal'+I.baixo+'</summary>'+
    '<div class="lembr__b">'+ todasPerguntas(r).filter(x=>(S.diario[x.q.id]||'').trim()).map(x=>
      '<div><div class="lembr__q">'+esc(x.p.titulo)+'</div>'+
      '<div class="lembr__t">'+esc(S.diario[x.q.id])+'</div></div>').join('')+'</div></details>';

  const corpo = (escrita && !editando)
    ? '<div class="rpfeito mt32">'+
        '<svg class="rpfeito__f" viewBox="0 0 1200 600" preserveAspectRatio="none" aria-hidden="true">'+
          Array.from({length:7},(_,i)=>'<path d="'+ondaH(1200,600,15+i*2,2+i*.16,i*.15,140+i*56)+'"/>').join('')+
        '</svg>'+
        '<div class="rpfeito__in"><p class="rpfeito__k">This is your Signal</p>'+
        '<p class="rpfeito__t">'+esc(escrita)+'</p>'+
        '<div class="rpfeito__m"><span class="rpfeito__d">'+dataBr(S.respostaEm||Date.now())+'</span>'+
        (S.respostaEd ? '<span class="editado" style="color:#8E86A0">editado</span>' : '')+
        '<button class="rpfeito__ed" data-a="editarResp">'+I.lapis+'Edit</button></div></div>'+
      '</div>'
    : '<div class="rp__box"><textarea id="rtx" placeholder="Write your answer. One sentence is enough, if it is true.">'+esc(S.rascunhoResp||escrita||'')+'</textarea>'+
      '<div class="rp__r">'+

/* ---------- a arte de compartilhar ---------- */
function pilarCritico(r){
  return DESEMPATE.slice().sort((a,b)=>{
    const d = r.pilares[a]-r.pilares[b];
    return d !== 0 ? d : DESEMPATE.indexOf(a)-DESEMPATE.indexOf(b);
  })[0];
}
function desenhaArte(cb){
  const escuro = S.arteEscura;
  const r = S.result, k = pilarCritico(r), P = ARTE.pilares[k];
  if(!S._arteFrase) S._arteFrase = P.frases[Math.floor(Math.random()*P.frases.length)];
  const frase = S._arteFrase;
  const c = document.createElement('canvas');
  c.width = 1080; c.height = 1350;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,1350);
  if(escuro){ g.addColorStop(0,'#1B1531'); g.addColorStop(.58,'#141020'); g.addColorStop(1,'#0C0917'); }
  else { g.addColorStop(0,'#FCFBFE'); g.addColorStop(.6,'#F8F6FD'); g.addColorStop(1,'#F1EDFA'); }
  x.fillStyle = g; x.fillRect(0,0,1080,1350);

  /* ---- o fundo, no desenho da 189 ----
     A arte estava chapada. A 189 resolvia isso com três coisas: a luz vindo de
     trás, as frequências atravessando a peça inteira, e uma vinheta que dá
     palco. Aqui é o mesmo desenho, em versão clara e escura. */
  const cor = CORPUS.pilares[k].cor;

  /* a luz, centrada atrás do instrumento */
  const luz = x.createRadialGradient(540, 470, 40, 540, 470, 640);
  if(escuro){
    luz.addColorStop(0, 'rgba(173,146,240,.32)');
    luz.addColorStop(.42, 'rgba(122,92,214,.14)');
    luz.addColorStop(1, 'rgba(122,92,214,0)');
  } else {
    luz.addColorStop(0, 'rgba(173,146,240,.22)');
    luz.addColorStop(.44, 'rgba(155,130,230,.09)');
    luz.addColorStop(1, 'rgba(155,130,230,0)');
  }
  x.fillStyle = luz; x.fillRect(0,0,1080,1350);

  /* as frequências, atravessando a peça de ponta a ponta */
  const onda = (base, amp, per, fase, alpha, w, cores) => {
    x.save(); x.strokeStyle = cores; x.lineWidth = w; x.lineCap = 'round';
    x.beginPath();
    for(let px=-20; px<=1100; px+=8){
      const py = base + Math.sin(px/per*Math.PI*2 + fase) * amp;
      if(px===-20) x.moveTo(px,py); else x.lineTo(px,py);
    }
    x.stroke(); x.restore();
  };
  const tinta = a => escuro ? 'rgba(198,180,255,'+a+')' : 'rgba(122,92,214,'+a+')';
  const f = escuro ? 1 : .62;   /* no claro as linhas pedem menos peso */
  [[236, 26, 780, 0.6, .16, 2.2], [402, 34, 900, 2.1, .13, 2.2],
   [604, 30, 720, 4.0, .10, 1.8], [742, 42, 960, 1.2, .16, 2.4],
   [856, 28, 780, 3.3, .13, 1.8], [1176, 34, 920, 2.6, .15, 2.2],
   [1246, 26, 780, 5.1, .11, 1.8]].forEach(o =>
    onda(o[0], o[1], o[2], o[3], 0, o[5], tinta((o[4]*f).toFixed(3))));

  /* um fio na cor do pilar: a arte pertence ao pilar que ela nomeia */
  onda(824, 25, 820, 2.4, 0, 2.6, cor + (escuro ? '99' : '55'));

  /* a vinheta, que dá palco ao centro */
  const vg = x.createRadialGradient(540, 620, 300, 540, 660, 980);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, escuro ? 'rgba(7,4,16,.55)' : 'rgba(64,48,120,.10)');
  x.fillStyle = vg; x.fillRect(0,0,1080,1350);

  /* o grão, fino, para a peça não parecer gerada */
  const gr = escuro ? 0.055 : 0.030;
  for(let i=0;i<2600;i++){
    x.fillStyle = (escuro ? 'rgba(255,255,255,' : 'rgba(40,26,80,') + (Math.random()*gr).toFixed(3) + ')';
    x.fillRect(Math.random()*1080, Math.random()*1350, 1.6, 1.6);
  }

  /* o diagrama oficial: só o pilar crítico acende */
  const sc = 830/1099, ox = (1080 - 1099*sc)/2 - 36*sc, oy = 285 - 43*sc;
  GEO10.forEach((geo,i)=>{
    const cx = ox + geo[0]*sc, cy = oy + geo[1]*sc, rr = geo[2]*sc;
    x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI*2);
    if(POS10[i] === k){ x.fillStyle = CORPUS.pilares[k].cor; x.fill();
      x.lineWidth = 3; x.strokeStyle = 'rgba(30,20,60,.18)'; x.stroke(); }
    else { x.lineWidth = 3.5; x.strokeStyle = escuro ? 'rgba(173,146,240,.42)' : '#C9B9EA'; x.stroke(); }
  });

  /* a frase, em duas linhas */
  const pal = frase.split(' ');
  let l1='', l2='';
  pal.forEach(w=>{
    if((l1+' '+w).trim().length <= Math.ceil(frase.length/2) && !l2) l1=(l1+' '+w).trim();
    else l2=(l2+' '+w).trim();
  });
  if(!l2){ l2=l1; l1=''; }
  x.textAlign='center';
  x.fillStyle = escuro ? '#F2EEFF' : '#241A3F'; x.font='italic 600 47px Georgia, serif';
  if(l1){ x.fillText(l1,540,1052); x.fillText(l2,540,1116); } else x.fillText(l2,540,1084);
  x.fillStyle = escuro ? '#9C8FD0' : '#6B5E93'; x.font='600 33px Georgia, serif';
  x.save(); x.letterSpacing='6px'; x.fillText('sendsignal.live',540,1258); x.restore();

  /* a marca completa no topo (21/09: "Signal by Vocalis", nunca "Signal"
     sozinho): o ícone à esquerda, "signal" ao lado e "by Vocalis" embaixo,
     no mesmo espaço vertical que o ícone ocupava, para não encostar na arte */
  const img = new Image();
  img.onload = () => {
    const ih = 104, iw = ih * (360/510);
    x.font = '300 76px Poppins, sans-serif';
    const tw = x.measureText('signal').width;
    const total = iw + 26 + tw, x0 = 540 - total/2, y0 = 100;
    x.drawImage(img, x0, y0, iw, ih);
    x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    x.fillStyle = escuro ? '#F4F1FF' : '#221B3A';
    x.fillText('signal', x0 + iw + 26, y0 + 66);
    x.font = '400 25px "IBM Plex Mono", monospace';
    x.fillStyle = escuro ? '#B9ADE6' : '#6C6880';
    x.save(); x.letterSpacing = '4px'; x.textAlign = 'right';
    x.fillText('by Vocalis', x0 + iw + 26 + tw, y0 + 104);
    x.restore();
    x.textAlign = 'center';
    cb(c.toDataURL('image/png'));
  };
  img.onerror = () => cb(c.toDataURL('image/png'));
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    MARK_SVG.replace('<svg ', '<svg fill="'+(escuro ? '#AD92F0' : '#4B2FA8')+'" '));
}

const JANELAS = [['7','1 week'],['30','1 month'],['180','6 months'],['365','1 year'],['todo','All time']];
/* sinais de uma combinação dentro de uma janela de tempo */
function sinaisCel(c, janela){ const j = {'7':c[19],'30':c[20],'180':c[21],'365':c[22]}[janela]; return j != null ? j : c[3]; }
function vozesCel(c, janela, recorte){
  const n = sinaisCel(c, janela);
  return recorte === 'comp' ? Math.round(n * (c[4] / Math.max(1, c[3]))) : n;
}
/* soma as combinações que batem com o filtro, pesando cada uma pelas vozes
   que entram. A nota sai da média exata, arredondada só no fim (A2). */
function agrega(f, janela, recorte){
  janela = janela || S.pJanela; recorte = recorte || S.pRecorte;
  const cs = AGREGADOS.filter(c =>
    (!f.setor || c[0] === f.setor) &&
    (!f.pais || f.pais === 'todos' || c[1] === f.pais) &&
    (!f.faixa || f.faixa === 'todas' || String(c[2]) === String(f.faixa)));
  let v = 0, comp = 0, nota = 0; const pil = {}, cam = {org:0, lider:0, indiv:0};
  AG_PILARES.forEach(k => pil[k] = 0);
  cs.forEach(c => {
    const w = vozesCel(c, janela, recorte); if(!w) return;
    v += w; comp += Math.round(sinaisCel(c, janela) * (c[4] / Math.max(1, c[3])));
    nota += c[5] * w;
    AG_PILARES.forEach((k, i) => pil[k] += c[6 + i] * w);
    cam.org += c[16] * w; cam.lider += c[17] * w; cam.indiv += c[18] * w;
  });
  if(!v) return { vozes:0, comp:0, nota:null, pilares:{}, camadas:{} };
  AG_PILARES.forEach(k => pil[k] = Math.round(pil[k] / v));
  Object.keys(cam).forEach(k => cam[k] = Math.round(cam[k] / v));
  return { vozes:v, comp:comp, nota:Math.round(nota / v), pilares:pil, camadas:cam };
}
/* o país do filtro: sem escolha, começa no país da pessoa (21/09, P6) */
function paisFiltro(){ return S.pPais || S.paisSinal || 'todos'; }
function listaPulsos(){

    .map(s => Object.assign({ setor:s[0], nome:s[1] }, agrega(Object.assign({ setor:s[0] }, f))));
  /* os que têm número primeiro; os que ainda se formam vão para o fim */
  l.sort((a,b) => {
    const fa = a.vozes >= MIN_VOZES, fb = b.vozes >= MIN_VOZES;

}

const F_ORDEM = [['maior','Highest harmony'],['menor','Lowest harmony'],['sinais','More voices']];

  '<div class="row mt24"><button class="btn btn--p" data-a="retirarConsentimentoOk">Withdraw and delete</button>'+
  '<button class="btn btn--q" data-a="fecha">Cancel</button></div>');
A.retirarConsentimentoOk = () => {
  S.diario = {}; S.diarioEm = {}; S.diarioEd = {}; S.resposta = ''; S.respondido = false; S.chat = [];
  S.consentiuTexto = false; S.consentiuTextoEm = null; fechaModal(); save();
  toast('Consent withdrawn. What you wrote has been deleted.'); ir('conta');
};
A.assistente = () => { S.gaveta = true; render({mantem:true});
  setTimeout(()=>{ const t=document.getElementById('gavTx'); if(t) t.focus(); }, 80); };
A.fecharGav = () => { S.gaveta = false; render({mantem:true}); };
A.gsug = v => A.gEnviar(v);
A.gEnviar = (txt) => {
  const el = document.getElementById('gavTx');
  const t = (typeof txt === 'string' ? txt : (el ? el.value : '')).trim();
  if(!t) return;
  if(S.chat.filter(m=>m.eu).length >= COTA) return;
  S.chat.push({eu:true, t:esc(t)});
  render({mantem:true});
  setTimeout(()=>{ const c=document.getElementById('gavTx'); if(c){ c.value=''; c.style.height='auto'; } }, 20);
  setTimeout(()=>{
    S.chat.push({eu:false, t:respostaAss(t)});
    render({mantem:true});
    setTimeout(()=>{ const b=document.getElementById('gavB'); if(b) b.scrollTop = b.scrollHeight; }, 40);
  }, 520);
  setTimeout(()=>{ const b=document.getElementById('gavB'); if(b) b.scrollTop = b.scrollHeight; }, 40);
};
A.liberarMsg = () => toast('In the prototype, nothing is charged. The quota would go to 45 messages.');

  '<button class="btn btn--q" data-a="fecha">Close</button></div></div>');
A.maisInfo = () => { fechaModal(); toast('We have sent more information to your email.'); };
A.novoOk = () => { fechaModal();
  /* o sinal atual vai para a estante antes de começar outro */
  if(S.result){
    S.sinais = (S.sinais||[]).filter(x=>x.id !== S.sinalId);
    S.sinais.unshift(Object.assign({}, sinalAtual(), {id:S.sinalId || ('s'+Date.now()), criado:S.criadoEm || hojeBr()}));
  }
  S.sinalId = 's'+Date.now(); S.criadoEm = hojeBr();
  S.perfil={}; S.respostas={}; S.qi=0; S.result=null; S.pago=false;
  S.sep={}; S.pi=0; S.acoes=[]; S.extraK=null; S.somado=null; S.respondido=false;
  S.empresa=''; S.empresaK=null; S.busca=''; S.setorSinal=''; S.somarPulado=false;
  S.diario={}; S.diarioEm={}; S.diarioEd={}; S.editando=null; S.rascunho='';
  S.resposta=''; S.respostaEm=null; S.respostaEd=false; S.editandoResp=false; S.rascunhoResp='';
  ir('avaliar'); };

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]');
  if(el){ if(el.tagName==='A') e.preventDefault(); const f=A[el.dataset.a]; if(f){ f(el.dataset.v); return; } }
  if(e.target.id==='modal') fechaModal();
});
document.addEventListener('input', e=>{
  if(e.target && e.target.id==='gavTx'){
    const t = e.target; t.style.height='auto';
    t.style.height = Math.min(t.scrollHeight, 150) + 'px';
    return;
  }
  if(e.target && e.target.id==='dtx'){ S.rascunho = e.target.value; save(); return; }
  if(e.target && e.target.id==='rtx'){ S.rascunhoResp = e.target.value; save(); return; }
  if(e.target && e.target.id==='pbq'){
    S.pBusca = e.target.value; const pos=e.target.selectionStart;
    render({mantem:true});
    const el=document.getElementById('pbq'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos);}catch(_){ } }
    return;
  }
  if(e.target && e.target.id==='pqp'){ S.vBuscaPais = e.target.value; A.abrirPaises();
    const el2=document.getElementById('pqp'); if(el2){ el2.focus(); el2.setSelectionRange(el2.value.length,el2.value.length); }
    return;
  }
  if(e.target && e.target.id==='empIn'){
    S.busca = e.target.value; S.empresa = e.target.value; S.empresaK = null;
    const pos = e.target.selectionStart;
    render({mantem:true});
    const el = document.getElementById('empIn');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){ } }
  }
});
document.addEventListener('keydown', e=>{
  if($('#modal').classList.contains('on')){ if(e.key==='Escape') fechaModal(); return; }
  if(S.rota==='email' && e.key==='Enter'){ A.emailOk(); return; }
  if(S.gaveta && e.key==='Escape'){ A.fecharGav(); return; }
  if(e.key==='Enter' && !e.shiftKey && document.activeElement && document.activeElement.id==='gavTx'){
    e.preventDefault(); A.gEnviar(); return; }
  if(S.rota==='diario' && (e.metaKey||e.ctrlKey) && e.key==='Enter'){
    const b=document.querySelector('[data-a="guardar"]'); if(b) b.click(); return; }
  if(S.rota!=='avaliar') return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(/^[1-6]$/.test(e.key)){ const b=$$('.opt')[+e.key-1]; if(b) b.click(); }
  if(e.key==='Enter'||e.key==='ArrowRight') A.qsegue();
  if(e.key==='ArrowLeft'||e.key==='Backspace') A.qvolta();
});

/* ============================================================
   BOOT · A Sala toca uma vez por sessão
   ============================================================ */
(function(){
  const reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  S._boot = !S.salaVista && !reduz && S.rota === 'home';
  if(S._boot) S.salaVista = true;
  if(S.rota==='apurando') S.rota = S.result ? 'sinal' : 'home';
  if(S.rota==='avaliar' && !Object.keys(S.perfil).length && !Object.keys(S.respostas).length) S.rota='home';
  render();
  if(S._boot) requestAnimationFrame(()=>requestAnimationFrame(tocarAbertura));
})();
</script>
