/* corpo com escala fluida (D-G4) */
html{font-size:clamp(17px, 15.6px + .32vw, 20px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:3px;border-radius:6px}
::selection{background:var(--mist)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

h1,h2,h3{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:500;
  line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(32px,5vw,54px)}
h2{font-size:clamp(26px,3.4vw,34px);font-variation-settings:'opsz' 48}
h3{font-size:clamp(19px,2.2vw,23px);font-variation-settings:'opsz' 36}
p{margin:0}
a{color:var(--violet);text-underline-offset:3px}
.mono{font-family:var(--f-mono)}
.lead{font-size:1.06rem;color:var(--ink-70);max-width:58ch;line-height:1.5}
.lead--s{font-size:.98rem;line-height:1.58;max-width:66ch}
.body{font-size:.95rem;color:var(--ink-70);max-width:62ch}
.small{font-size:.85rem;color:var(--slate)}
.tiny{font-size:.76rem;color:var(--slate)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wrap{max-width:740px;margin:0 auto;padding:0 20px}
.wrap--wide{max-width:1080px}
.screen{padding:calc(var(--top) + 34px) 0 130px}
.sr{position:absolute;left:-9999px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt36{margin-top:36px}
/* o seletor de país do sinal */
.pulso--vazio{background:linear-gradient(160deg,#241C3F,#15102A);color:#E9E4F7;padding:22px 20px;border-radius:var(--r-md)}
.pulso--vazio h3{font-family:var(--f-display);font-size:1.35rem;color:#fff}
.pulso--vazio .body{color:#B6AED0}
.pl2s{display:grid;gap:14px}
.pl2{position:relative;padding:18px 18px 16px;border-radius:var(--r-md);
  border:1px solid var(--line);background:#fff}
.pl2--on{border-color:var(--violet);box-shadow:0 0 0 3px var(--mist)}
.pl2__m{position:absolute;top:-9px;left:16px;padding:3px 10px;border-radius:999px;
  background:var(--violet);color:#fff;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase}
.pl2__h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pl2__n{font-family:var(--f-display);font-size:1.16rem}
.pl2__p{font-family:var(--f-display);font-size:1.3rem;color:var(--violet)}
.pl2__p small{font-size:.66rem;color:var(--slate);margin-left:2px}
.pl2__l{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.pl2__l li{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;color:var(--ink-70)}
.pl2__l svg{width:15px;height:15px;color:var(--calm);flex:none;margin-top:2px}
.pl2__atual{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--calm)}
.paisSel{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--lilac-soft);
  background:var(--mist);cursor:pointer;transition:border-color .2s var(--ease)}
.paisSel:hover{border-color:var(--lilac)}
.paisSel__k{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.paisSel__v{flex:1;text-align:right;font-size:.95rem;color:var(--ink)}
.paisSel__v small{color:var(--slate);font-family:var(--f-mono);font-size:.72rem;margin-left:4px}
.paisSel__s{width:16px;color:var(--slate)}
.paisSel__s svg{width:16px;height:16px}
.pais__f{margin-right:8px}
/* a faixa de contexto: onde estou e como volto */
.onde{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.onde__v{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;
  font:inherit;font-size:.86rem;color:var(--violet);cursor:pointer}
.onde__v svg{width:15px;height:15px}
.onde__t{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.onde__t b{color:var(--slate);font-weight:400}
/* a imagem só desaparece por um instante enquanto o canvas é redesenhado */
/* ============================================================
   A CELEBRAÇÃO · o escuro entra por cima, a mensagem sobe, o escuro sai.
   Tudo em opacity e transform, uma curva por camada.
   ============================================================ */
.cel{position:fixed;inset:0;z-index:200;display:grid;place-items:center;pointer-events:none;overflow:hidden;
  background:radial-gradient(74% 88% at 50% 44%, #1E1739 0%, #130F25 50%, #090713 100%);
  opacity:0;will-change:opacity;
  animation:celEntra .95s cubic-bezier(.32,.06,.24,1) forwards,
            celSai 1.15s cubic-bezier(.45,0,.2,1) 3.05s forwards}
@keyframes celEntra{ to{opacity:1} }
@keyframes celSai{ to{opacity:0} }
/* a luz que sobe por dentro */
.cel::before{content:'';position:absolute;inset:0;
  background:radial-gradient(56% 62% at 50% 46%, rgba(184,160,248,.34), rgba(122,92,214,.12) 58%, transparent 82%);
  opacity:0;will-change:opacity,transform;transform:scale(.88);
  animation:celLuz 2.2s cubic-bezier(.24,.7,.28,1) .5s forwards}
@keyframes celLuz{ to{opacity:1;transform:scale(1)} }
.cel__ondas{position:absolute;inset:0;display:flex;align-items:center;opacity:0;
  animation:celOndas 2.4s cubic-bezier(.3,.7,.3,1) .35s forwards}
.cel__ondas svg{width:100%;height:58%}
@keyframes celOndas{ to{opacity:.5} }
.cel__in{position:relative;text-align:center;padding:0 28px;max-width:30ch}
/* cada peça entra na sua vez */
.cel__mk,.cel__k,.cel__t,.cel__ln{opacity:0;will-change:opacity,transform}
.cel__mk{display:inline-flex;width:46px;height:46px;transform:translateY(10px) scale(.92);
  animation:celSobe 1.1s cubic-bezier(.2,.72,.24,1) .72s forwards}
.cel__mk .mark{width:46px;height:46px;background:#CDBBF7}
.cel__k{margin:20px 0 0;font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:#A99BD8;transform:translateY(10px);
  animation:celSobe 1.1s cubic-bezier(.2,.72,.24,1) 1.02s forwards}
.cel__t{margin:14px 0 0;font-family:var(--f-display);font-variation-settings:'opsz' 42;
  font-weight:400;font-size:clamp(26px,4.4vw,36px);line-height:1.24;color:#F4F0FF;
  letter-spacing:-.012em;transform:translateY(14px);
  animation:celSobe 1.35s cubic-bezier(.2,.72,.24,1) 1.28s forwards}
.cel__ln{display:block;width:0;height:1px;margin:26px auto 0;background:rgba(205,187,247,.5);
  animation:celLinha 1.5s cubic-bezier(.3,.7,.3,1) 1.9s forwards}
@keyframes celSobe{ to{opacity:1;transform:none} }
@keyframes celLinha{ to{opacity:1;width:86px} }
@media(prefers-reduced-motion:reduce){ .cel{display:none} }

.arte{transition:opacity .18s ease}
.arte--troca{opacity:.35}
/* a barra que diz de qual sinal é o diário, quando há mais de um */
.bsin{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:0 auto 14px;max-width:var(--w);padding:9px 14px;border-radius:12px;
  background:var(--paper-2);border:1px solid var(--line)}
.bsin__t{font-size:.86rem;color:var(--ink-70)}
.bsin__t b{color:var(--ink)}
.bsin__d{color:var(--slate)}
/* as estrelas da pesquisa */
.ests{display:flex;gap:14px;justify-content:center;padding:6px 0 2px}
.est{background:none;border:0;padding:6px;cursor:pointer;line-height:0;color:var(--line-2);
  transition:color .18s var(--ease), transform .18s var(--ease)}
.est svg{width:46px;height:46px}
.est.on{color:#E8B93C}
.est:hover{color:#E8B93C;transform:translateY(-2px)}
.est:active{transform:translateY(0)}
.ests__r{margin:10px 0 0;text-align:center;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
/* a caixa de comentário no padrão do Signal */
.escreve--pq{box-shadow:none;border-color:var(--line);padding:14px 16px 12px}
.escreve--pq textarea{min-height:82px;font-size:.95rem}
.escreve__k{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate);margin-bottom:8px}
/* a palavra em destaque, no lilás da casa */
.lil{color:var(--violet);font-style:normal}
.selo--luz{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
  background:rgba(173,146,240,.16);color:#D9CCFA}
.selo--luz svg{width:26px;height:26px}
.mt32{margin-top:32px}.mt48{margin-top:48px}

/* ============================================================
   ABERTURA · v10 da 189. O ruído acontece no escuro, a luz sobe,
   e a entrada se compõe em tempos. Sem logo no centro.
   ============================================================ */
.intro--boot{overflow:clip}
.intro--boot::before{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(97deg,
    rgba(250,249,255,0) 0%, rgba(243,238,255,.04) 29%, rgba(238,230,255,.20) 38%,
    rgba(230,211,168,.09) 41.2%, rgba(221,209,250,.40) 44%, rgba(173,146,240,.28) 47%,
    rgba(99,75,170,.52) 50.6%, #241C3E 56%, #161126 62%, #0D0A18 70%, #0A0813 100%);
  background-size:300% 100%; background-position:100% 0;
  animation:bootAmanhece 2.15s cubic-bezier(.52,.05,.28,.97) 2.35s forwards;
}
@keyframes bootAmanhece{ 84%{opacity:1} to{background-position:0% 0;opacity:0} }
.intro--boot .intro__bg{z-index:3;opacity:.85;filter:drop-shadow(0 0 16px rgba(173,146,240,.35))}
.intro--boot .intro__bg path{mix-blend-mode:screen}
/* nada aparece antes da sua vez; .rv é o que revela */
.intro--boot #introPanel > *{opacity:0;transform:translateY(14px)}
.intro--boot #introBrand{opacity:0;transform:translateY(10px)}
.intro--boot .introTag{opacity:0;transform:translateY(10px)}
.intro--boot .intro__foot{opacity:0;transform:translateY(10px)}
.intro--boot .rv{opacity:1!important;transform:none!important;
  transition:opacity 1s ease, transform 1s cubic-bezier(.18,.72,.24,1)}
#opSkip{position:absolute;bottom:74px;right:30px;z-index:10;font-family:var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;font-size:10px;color:var(--slate);padding:6px 10px}
.intro--boot #opSkip{color:#A79FC2;animation:opSkipEntardece 1.2s var(--ease) 3.1s forwards}
@keyframes opSkipEntardece{to{color:var(--slate)}}
@media(prefers-reduced-motion:reduce){ .intro--boot::before{display:none} }

/* ============================================================
   LOCKUP · marca original da 189
   ============================================================ */
.mark{display:inline-block;width:1em;height:1.41em;vertical-align:-.28em;background-color:currentColor;
  -webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.wordmark{font-family:var(--f-mark);font-weight:300;letter-spacing:-.01em;text-transform:lowercase}
.lockup{display:inline-flex;align-items:center;gap:.5em;line-height:1}

/* ============================================================
   PASSAGEM · um movimento só: a marca emerge e tudo se dissolve
   Só opacidade e transform, para o navegador compor na GPU.
   ============================================================ */
.trans{position:fixed;inset:0;z-index:190;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(70% 86% at 50% 46%, #1B1533 0%, #120E23 48%, #0A0816 100%);
  will-change:opacity;
  animation:transOut 1.05s cubic-bezier(.45,0,.2,1) .82s forwards}
@keyframes transOut{ from{ opacity:1 } to{ opacity:0 } }
/* a luz que sobe por dentro, para o escuro clarear sem filtro */
.trans::before{content:'';position:absolute;inset:0;
  background:radial-gradient(58% 70% at 50% 46%, rgba(184,160,248,.4), rgba(122,92,214,.14) 56%, transparent 80%);
  opacity:0;will-change:opacity;
  animation:transLuz 1.25s cubic-bezier(.4,0,.3,1) .58s forwards}
@keyframes transLuz{ from{ opacity:0 } to{ opacity:1 } }
.trans__lg{position:relative;z-index:2;font-size:32px;color:var(--lilac);will-change:opacity,transform;
  animation:transLg 1.62s cubic-bezier(.4,0,.25,1) both}
.trans__lg .wordmark{color:#F4F1FF;font-size:36px}
@keyframes transLg{
  0%  { opacity:0; transform:translateY(10px) scale(.97) }
  32% { opacity:1; transform:none }
  56% { opacity:1; transform:none }
  100%{ opacity:0; transform:scale(1.035) }
}
@media(prefers-reduced-motion:reduce){ .trans{display:none} }

/* ============================================================
   BARRA SUPERIOR (seção 17)
   ============================================================ */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:60;display:flex;align-items:center;
  background:rgba(252,252,254,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.top__in{width:100%;max-width:1180px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px}
.lg{display:inline-flex;align-items:center;gap:.42em;font-size:19px;color:var(--violet);text-decoration:none;line-height:1}
.lg .wordmark{color:var(--ink);font-size:21px}
.passo{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--slate);white-space:nowrap}
.passo em{font-style:normal}
@media(max-width:700px){ .passo em{display:none} }
.nav{margin-left:auto;display:flex;gap:2px}
.ni{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 13px;
  font-size:.8rem;color:var(--ink-70);white-space:nowrap}
.ni:hover{background:var(--mist)}
.ni.on{background:var(--ink);color:#fff;font-weight:600}
.ni.lk{color:var(--slate)}
.ni svg{width:12px;height:12px}
.criar{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  background:#fff;padding:8px 14px 8px 11px;font-size:.78rem;font-weight:600;color:var(--violet-dark);white-space:nowrap}
.criar:hover{border-color:var(--lilac);background:var(--mist)}
.criar svg{width:14px;height:14px}
@media(max-width:860px){ .nav{display:none} .criar span{display:none} .criar{padding:9px;margin-left:auto} }
/* abas do celular */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
  background:rgba(252,252,254,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;
  font-size:.6rem;color:var(--slate);font-weight:500}
.tb svg{width:19px;height:19px}
.tb.on{color:var(--violet-dark);background:var(--mist);font-weight:600}
.tb.lk{opacity:1;color:var(--slate)}
@media(max-width:860px){ body[data-tabs="1"] .tabs{display:flex} body[data-tabs="1"] .screen{padding-bottom:170px} }

/* ============================================================
   BOTÕES
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:999px;
  font-size:.92rem;font-weight:600;padding:14px 24px;transition:background .16s,border-color .16s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn--p{background:var(--violet);color:#fff;box-shadow:var(--shadow-1)}
.btn--p:hover{background:var(--violet-dark)}
.btn--p[disabled]{background:var(--line);color:var(--slate);box-shadow:none;cursor:not-allowed}
.btn--g{background:#fff;border:1px solid var(--line);color:var(--ink-70)}
.btn--g:hover{border-color:var(--lilac);background:var(--mist)}
.btn--q{color:var(--slate);font-weight:500;font-size:.85rem;padding:8px 4px;
  text-decoration:underline;text-underline-offset:4px}
.btn--q:hover{color:var(--ink)}
.btn--sm{padding:11px 18px;font-size:.82rem}

/* ============================================================
   INTRO · exatamente como na 189
   ============================================================ */
.intro{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,#FFFFFF 0%, #FBFAFF 55%, #F5F1FE 100%)}
.intro__bg{position:absolute;inset:0;pointer-events:none;opacity:.6;display:flex;align-items:center}
.intro__bg svg{width:100%;height:62%}
.intro__inner{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;
  max-width:820px;margin:0 auto;padding:40px 40px 20px;width:100%}
@media(max-width:820px){ .intro__inner{padding:34px 22px} }
.intro__top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:auto}
.intro__bot{margin-top:auto}
.panel{animation:panelIn .7s var(--ease) both;margin:44px 0}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:panelIn .7s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.14s}
.stagger>*:nth-child(3){animation-delay:.23s}
.stagger>*:nth-child(4){animation-delay:.32s}
.stagger>*:nth-child(5){animation-delay:.41s}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
.panel h1{margin:16px 0 20px}
.panel .lead{max-width:56ch}
.intro__foot{position:relative;padding:22px 40px calc(34px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto;width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
@media(max-width:820px){ .intro__foot{padding:16px 22px 26px} }
.ticks{display:flex;gap:6px}
.tick{width:26px;height:2px;border-radius:2px;background:var(--line);transition:background .3s}
.tick.on{background:var(--ink)}
.tick.done{background:var(--lilac-soft)}
.intro__meta{font-size:.82rem;color:var(--slate)}
.intro__n{margin-top:20px;display:flex;align-items:center;gap:9px;font-size:.84rem;color:var(--ink-70)}
.intro__n i{width:7px;height:7px;border-radius:50%;background:var(--calm);box-shadow:0 0 0 4px rgba(62,158,134,.16)}


/* ============================================================
   SINAL · bloco 2
   ============================================================ */
.hhero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:30px 34px 26px;color:#EFE9FF;
  background:radial-gradient(70% 90% at 62% 26%, rgba(122,92,214,.34), transparent 66%),
             radial-gradient(40% 50% at 8% 100%, rgba(194,162,101,.10), transparent 60%),
             linear-gradient(160deg,#100D1D,#181330 52%,#0B0916);
  border:1px solid rgba(255,255,255,.07);box-shadow:0 40px 90px -40px rgba(20,12,50,.6)}
.hhero__f{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hhero__f path{fill:none;stroke:rgba(190,168,255,.20);stroke-width:1}
.hhero__in{position:relative;z-index:2}
.hhero__top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hhero__top .k{color:var(--lilac);font-size:11.5px;letter-spacing:.17em}
.hpill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.16);font-size:.72rem;font-weight:600;color:#D9D3F5}
.hpill i{width:7px;height:7px;border-radius:50%;background:var(--calm);box-shadow:0 0 0 3px rgba(62,158,134,.22)}
.hhero__core{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;margin-top:26px}
@media(max-width:820px){ .hhero{padding:24px 20px 22px} .hhero__core{grid-template-columns:1fr;gap:22px} }
.hhero__h{font-family:var(--f-display);font-variation-settings:'opsz' 96;font-weight:430;
  font-size:clamp(28px,4.4vw,42px);line-height:1.08;letter-spacing:-.03em;margin:0;color:#fff}
.hhero__h em{font-style:normal;color:#C6B1FA}
.hhero__l{margin:16px 0 0;color:#C9C2E0;font-size:.95rem;max-width:44ch;line-height:1.55}
/* orbe */
.orbe{position:relative;width:230px;max-width:100%;aspect-ratio:1;display:grid;place-items:center;justify-self:center}
@media(max-width:820px){ .orbe{width:200px} }
.orbe__g{position:absolute;width:76%;aspect-ratio:1;border-radius:50%;filter:blur(30px);opacity:.5}
.orbe__s{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orbe__s circle{fill:none}
.orbe__t{stroke:rgba(255,255,255,.08);stroke-width:1}
.orbe__p{stroke-width:2.6;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.orbe__c{position:relative;text-align:center}
.orbe__n{font-family:var(--f-display);font-variation-settings:'opsz' 144;font-weight:400;font-size:56px;
  line-height:.9;letter-spacing:-.04em;color:#fff;white-space:nowrap}
.orbe__n small{font-family:var(--f-mono);font-size:15px;font-weight:400;color:#8E86A0;margin-left:3px;letter-spacing:0}
.orbe__e{margin-top:11px;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#EFE9FF}

/* escala dos seis estados */
.esc{margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)}
.esc__w{position:relative;margin-top:8px}
.esc__b{height:10px;border-radius:999px;overflow:hidden;display:flex}
.esc__b i{height:100%}
.esc__m{position:absolute;top:-7px;width:3px;height:24px;border-radius:3px;background:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.18);transform:translateX(-50%);transition:left 1.1s var(--ease)}
.esc__t{position:absolute;top:26px;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--f-mono);font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
.esc__l{display:flex;justify-content:space-between;margin-bottom:9px;font-family:var(--f-mono);
  font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#8E86A0}
.esc{padding-bottom:44px}
/* apoio · cartão claro, fora do herói */
.apoio{display:grid;grid-template-columns:auto 1fr;gap:16px;margin-top:20px;padding:20px 22px;
  border:1px solid #F0DCDF;border-radius:var(--r-lg);background:#FFFAFA}
.apoio__i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(210,86,90,.12);color:var(--hot)}
.apoio__i svg{width:19px;height:19px}
.apoio__t{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.02rem;margin:0}
.apoio p{margin:7px 0 0;font-size:.88rem;color:var(--ink-70);line-height:1.6;max-width:60ch}
.apoio b{color:var(--ink)}
.apoio .tiny{display:block;margin-top:10px}
@media(max-width:560px){ .apoio{grid-template-columns:1fr;gap:12px;padding:18px} }
/* camadas */
.cam__lead{font-family:var(--f-body);font-weight:400;font-size:clamp(16px,1.7vw,18px);
  line-height:1.62;margin:12px 0 0;color:var(--ink-70)}
.cam{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);padding:24px 26px;display:grid;gap:20px}
.cam__i{display:grid;grid-template-columns:250px 1fr 56px;align-items:center;gap:20px}
.cam__l{display:block;min-width:0}
.cam__n{display:block;font-size:.92rem;font-weight:600;line-height:1.25}
.cam__d{display:block;font-size:.76rem;color:var(--slate);line-height:1.4;margin-top:3px}
.cam__b{display:block;height:24px;background:var(--line-soft);border-radius:8px;overflow:hidden}
.cam__b b{display:block;height:100%;border-radius:8px;transition:width .9s var(--ease)}
.cam__v{font-family:var(--f-mono);font-size:.92rem;text-align:right;font-weight:500}
.cam__fim{margin-top:20px;font-size:.95rem;color:var(--ink-70);max-width:76ch;line-height:1.6}
@media(max-width:760px){ .cam{padding:18px 18px;gap:16px}
  .cam__i{grid-template-columns:1fr 56px;gap:4px 12px}
  .cam__l{grid-column:1} .cam__v{grid-column:2;align-self:start}
  .cam__b{grid-column:1/-1;height:20px;margin-top:6px} }
/* pergunta */
.perg__t{font-family:var(--f-display);font-variation-settings:'opsz' 96;font-weight:500;
  font-size:clamp(26px,3.8vw,38px);line-height:1.14;letter-spacing:-.014em;margin:12px auto 0;max-width:20ch}
/* véu */
.veu{position:relative;display:grid;margin-top:34px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-1)}
.veu > *{grid-area:1/1}
.veu__p{filter:blur(7px);opacity:.5;pointer-events:none;user-select:none;padding:26px;align-self:start}
.veu__g{background:linear-gradient(180deg,rgba(252,252,254,.62) 0%,rgba(252,252,254,.86) 26%,rgba(252,252,254,.96) 46%,#FCFCFE 62%)}
.veu__c{align-self:stretch;padding:52px 30px 40px;position:relative;display:flex;flex-direction:column;
  align-items:center;text-align:center}
.veu__c > .k{font-size:11.5px;letter-spacing:.17em;color:var(--violet);line-height:1.7}
.veu__d{font-size:.95rem;color:var(--ink-70);line-height:1.62;margin:22px 0 0;max-width:60ch}
.veu .dois__l{width:100%;max-width:640px;margin-top:22px}
.ex2--lk{opacity:.9;cursor:default}
.ex2--lk .ex2__n{background:var(--mist);color:var(--violet)}
.ex2--lk:hover{border-color:var(--line)}
.ex2__lk{display:grid;place-items:center;color:var(--slate)}
.ex2__lk svg{width:15px;height:15px}
@media(max-width:640px){ .veu__c{padding:34px 20px 30px} }
.veu__sep{width:54px;height:1px;background:var(--line-2);margin:34px 0 26px}
@media(max-width:640px){ .veu__c{padding:18px 18px 20px} }
.veu__k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.veu__h{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;font-size:clamp(19px,2.6vw,24px);
  line-height:1.26;margin:10px 0 0;max-width:36ch}
.veu__l{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.veu__l li{display:grid;grid-template-columns:16px 1fr;gap:10px;font-size:.86rem;color:var(--ink-70);line-height:1.45}
.veu__l svg{width:14px;height:14px;color:var(--calm);margin-top:3px}
.veu__f{font-size:.76rem;color:var(--slate);margin-top:14px}
/* prévia borrada dos pilares */
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){ .prev{grid-template-columns:1fr} }
.prev__c{border:1px solid var(--line);border-radius:16px;padding:14px}
.prev__t{font-family:var(--f-display);font-size:15px;margin-bottom:8px}
.prev__r{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.prev__r i{width:8px;height:8px;border-radius:3px;flex:none}
.prev__r span{flex:1;height:5px;border-radius:999px;background:var(--line)}
.prev__r span b{display:block;height:100%;border-radius:999px}


/* ---- para responder a essa pergunta: os dois exercícios ---- */
.dois{margin-top:36px}
.dois__d{color:var(--ink-70);font-size:.98rem;line-height:1.6;max-width:62ch;margin:12px 0 0}
.dois__l{display:grid;gap:12px;margin-top:22px}
.ex2{display:grid;grid-template-columns:34px 1fr auto;gap:16px;align-items:center;background:#fff;
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:18px 22px;
  width:100%;text-align:left}
.ex2:hover{border-color:var(--lilac)}
.ex2__n{width:30px;height:30px;border-radius:50%;background:var(--mist);color:var(--violet);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem;font-weight:500}
.ex2--ok .ex2__n{background:rgba(62,158,134,.14);color:var(--calm)}
.ex2__t{display:block;font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.08rem;line-height:1.2;color:var(--ink)}
.ex2__d{display:block;font-size:.84rem;color:var(--ink-70);margin-top:4px;line-height:1.5}
.ex2__s{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);white-space:nowrap}
.ex2--ok .ex2__s{color:var(--calm)}
.ex2 svg{width:16px;height:16px;color:var(--slate);flex:none}
@media(max-width:620px){ .ex2{grid-template-columns:34px 1fr;gap:12px} .ex2__s{grid-column:2} }

/* ============================================================
   BLOCO 3 · dez pilares, bússola, separação, ações
   ============================================================ */
/* bússola */
.buss{display:block;width:100%;height:auto;overflow:visible}
/* botão da metodologia, no canto */
.metod{position:absolute;top:0;right:0;width:62px;height:62px;border-radius:50%;background:#fff;
  border:1px solid var(--line);box-shadow:var(--shadow-1);display:grid;place-items:center;padding:11px}
.metod::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--lilac);
  opacity:0;animation:metodPulse 2.6s ease-out infinite}
@keyframes metodPulse{0%{opacity:.65;transform:scale(1)}70%{opacity:0;transform:scale(1.22)}100%{opacity:0}}
.metod:hover{border-color:var(--lilac)}
.metod .buss circle{animation:none;opacity:1}
.metod .buss .anel{display:none}
@media(max-width:700px){ .metod{width:52px;height:52px;padding:9px} }
.pilhead{position:relative;padding-right:78px}
.pilhead .k{font-size:11.5px;letter-spacing:.17em;color:var(--violet)}
@media(prefers-reduced-motion:reduce){ .metod::after{display:none} }
/* popup */
.mpop{width:min(430px,100%)}
.mpop__logo{height:52px;width:auto;display:block;margin:0 auto 20px}
.mpop{text-align:center}
.mpop h3{font-size:1.24rem;margin:0 0 12px}
.mpop h3 sup{font-size:.44em;vertical-align:super;letter-spacing:.04em}
.mpop p{font-size:.92rem;color:var(--ink-70);line-height:1.62;margin:0 0 10px}
.mpop .tiny{margin-top:14px;display:block}
.mpop__b{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.mpop p{text-align:left}
.buss circle{transform-origin:center;transform-box:fill-box;opacity:0;
  animation:bussIn .62s var(--ease) both}
.buss circle.sel{filter:drop-shadow(0 0 10px rgba(107,78,216,.35))}
@keyframes bussIn{from{opacity:0;transform:scale(.42)}to{opacity:1;transform:none}}
@keyframes aparPulse{0%{r:var(--r0);opacity:.55}70%{r:var(--r1);opacity:0}100%{opacity:0}}
.buss .anel{fill:none;stroke:var(--violet);stroke-width:5;opacity:0;
  animation:anelPulse 2.4s ease-out infinite}
@keyframes anelPulse{0%{opacity:.5;transform:scale(1)}70%{opacity:0;transform:scale(1.28)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){ .buss circle{animation:none;opacity:1} .buss .anel{display:none} }
/* cartões dos grupos */
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
@media(max-width:860px){ .gr{grid-template-columns:1fr} }
.grc{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:20px 22px}
.grc__h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.grc__t{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.14rem;margin:0}
.grc__e{display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;white-space:nowrap;flex:none;
  font-family:var(--f-mono);font-size:9.5px;font-weight:400;letter-spacing:.13em;text-transform:uppercase}
.grc__e i{display:none}
/* leitura em uma frase */
.lq{position:relative;overflow:hidden;margin-top:30px;border-radius:var(--r-lg);border:1px solid var(--line);
  background:#fff;box-shadow:var(--shadow-1);padding:26px 28px}
.lq__w{position:absolute;inset:auto 0 0 0;width:100%;height:62%;opacity:.5;pointer-events:none}
.lq__w path{fill:none;stroke:var(--lilac-soft);stroke-width:1}
.lq__in{position:relative}
.lq .k{font-size:10.5px;color:var(--slate);letter-spacing:.15em}
.lq blockquote{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;
  font-size:clamp(19px,2.3vw,24px);line-height:1.34;margin:10px 0 2px;letter-spacing:-.006em}
.lq blockquote em{font-style:normal;color:var(--violet-dark)}
.lq__n{font-size:.82rem;color:var(--slate);margin:14px 0 0;max-width:62ch;line-height:1.6}
.grc__d{font-size:.82rem;color:var(--slate);margin:5px 0 14px;line-height:1.5}
.pl{display:grid;grid-template-columns:12px 1fr 44px 38px;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line-soft)}
.pl:first-of-type{border-top:0}
.pl__i{width:11px;height:11px;border-radius:4px}
.pl__n{font-size:.88rem;line-height:1.28;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl__b{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.pl__b b{display:block;height:100%;border-radius:999px;transition:width .8s var(--ease)}
.pl__v{font-family:var(--f-mono);font-size:.86rem;text-align:right;font-weight:500}
.pl--sel{position:relative}
.pl--sel .pl__n{font-weight:400}
.pl__tag{position:relative;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.11em;
  text-transform:uppercase;color:var(--violet-dark);background:var(--mist);border:1px solid var(--lilac-soft);
  border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
.pl__tag--on::after{content:'';position:absolute;inset:-3px;border-radius:999px;border:1.5px solid var(--lilac);
  opacity:0;animation:tagPulse 2.4s ease-out infinite;pointer-events:none}
@keyframes tagPulse{0%{opacity:.7;transform:scale(1)}70%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){ .pl__tag--on::after{display:none} }
/* ============================================================
   FICHA DO PILAR · painel escuro da 189, com orbe do pilar
   ============================================================ */
.tri{display:flex;gap:8px;height:9px;margin-top:18px}
.tri i{flex:1;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.tri i b{position:absolute;inset:0;border-radius:999px;background:var(--violet);
  transform-origin:left;transition:transform .45s var(--ease),background .3s var(--ease)}
.tri i b.aqui{background:var(--lilac)}
.tri__l{display:flex;justify-content:space-between;margin-top:9px;font-size:.8rem;color:var(--slate)}
.tri__l b{color:var(--ink);font-weight:600}

.ficha{position:relative;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--shadow-2);overflow:hidden}
.ficha__faixa{height:9px;width:100%}
.ficha__h{padding:24px 30px 22px}
@media(max-width:700px){ .ficha__h{padding:20px 20px 18px} }
.ficha__top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.ficha__gr{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);
  display:flex;align-items:center;gap:8px}
.ficha__gr i{width:9px;height:9px;border-radius:3px}
.ficha__n{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:500;
  font-size:clamp(25px,3.2vw,34px);line-height:1.06;margin:8px 0 0;letter-spacing:-.018em}
.ficha__nota{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
.ficha__v{font-family:var(--f-display);font-variation-settings:'opsz' 96;font-weight:400;
  font-size:clamp(32px,4.4vw,44px);line-height:.92;letter-spacing:-.035em;white-space:nowrap}
.ficha__v small{font-family:var(--f-mono);font-size:.34em;color:var(--slate);margin-left:2px;letter-spacing:0}
/* a escala dos seis estados na ficha */
.pesc{position:relative;margin-top:22px}
.pesc__b{display:flex;height:9px;border-radius:999px;overflow:hidden}
.pesc__b i{height:100%}
.pesc__m{position:absolute;top:-5px;width:3px;height:19px;border-radius:3px;background:var(--ink);
  box-shadow:0 0 0 3px rgba(252,252,254,.9);transform:translateX(-50%);transition:left .9s var(--ease)}
@media(max-width:560px){ .ficha__v{font-size:30px} }

.chipE{display:inline-flex;align-items:center;border-radius:999px;padding:7px 15px;white-space:nowrap;
  font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:560px){ .chipE{font-size:8.5px;padding:4px 8px;letter-spacing:.08em} }
.chipE i{display:none}
/* a escala da harmonia, horizontal */
.ficha__bar{height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin-top:18px}
.ficha__bar b{display:block;height:100%;border-radius:999px;transition:width .9s var(--ease)}
.ficha__txt{margin-top:20px;font-size:1rem;line-height:1.66;color:var(--ink-70)}
.ficha__txt b{color:var(--ink);font-weight:600}
@media(max-width:420px){ .ficha__v{font-size:30px} .chipE{font-size:.68rem;padding:3px 10px 3px 8px} }

/* painel escuro */
.alc{display:grid;grid-template-columns:1.45fr 1fr;gap:0}
@media(max-width:860px){ .alc{grid-template-columns:1fr} }
.alc__d{background:radial-gradient(80% 110% at 78% -10%, rgba(122,92,214,.26), transparent 58%),
  linear-gradient(158deg,#1D1731 0%,#141021 55%,#0E0B1B 100%);color:#EFE9FF;padding:24px 26px 26px}
.alc__k{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.alc__k span{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;
  font-size:1.18rem;color:#fff;letter-spacing:-.008em}
.alc__k span::first-letter{text-transform:uppercase}
.alc__k b{font-family:var(--f-mono);font-size:.8rem;color:var(--lilac);font-weight:400}
.alc__s{font-size:.88rem;color:#C9C2E0;margin:8px 0 0}
.alc__i{position:relative;margin-top:14px;border-radius:16px;background:rgba(255,255,255,.045);
  padding:20px 22px 18px;transition:background .22s var(--ease)}
.alc__i::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
  background:var(--lilac);opacity:0;transition:opacity .22s}
.alc__i.on{background:rgba(173,146,240,.13)}
.alc__i.on::before{opacity:1}
.alc__t{font-size:1rem;line-height:1.5;margin:0 0 16px;color:#E8E2FA}
.alc__b{display:flex;gap:10px;flex-wrap:wrap}
.alc__b button{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(173,146,240,.62);
  border-radius:999px;background:transparent;padding:12px 20px 12px 16px;
  font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  color:#CFC7E6;transition:all .2s var(--ease);white-space:nowrap}
.alc__b button span.dot{width:9px;height:9px;border-radius:50%;flex:none;
  border:1.5px solid rgba(173,146,240,.75);background:transparent;transition:all .2s}
.alc__b button:hover{border-color:var(--lilac);color:#F6F3FF}
.alc__b button:hover span.dot{border-color:var(--lilac)}
.alc__b button[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:#1A1430;font-weight:600}
.alc__b button[aria-pressed="true"] span.dot{background:#1A1430;border-color:#1A1430}
/* "not right now" marcado mantém o contorno; só o ponto acende */
.alc__b button.nao[aria-pressed="true"]{background:var(--mist);border-color:var(--mist);color:var(--ink-70);font-weight:600}
.alc__b button.nao[aria-pressed="true"] span.dot{background:var(--slate);border-color:var(--slate)}
.alc__ok{background:linear-gradient(158deg,#F3FBF8,#EEF8F4);padding:26px 28px;display:flex;
  flex-direction:column;justify-content:center;border-right:1px solid rgba(62,158,134,.16)}
.alc__okt{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;
  font-size:1.18rem;color:#2E7A66;margin:0}
.alc__okd{font-size:.9rem;color:var(--ink-70);line-height:1.6;margin:10px 0 0;max-width:42ch}
@media(max-width:860px){ .alc__ok{border-right:0;border-bottom:1px solid rgba(62,158,134,.16)} }
.alc__l{background:var(--paper-2);padding:24px 26px 26px}
.alc__lk{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.18rem;color:var(--ink);letter-spacing:-.008em;margin:0}
.alc__lk::first-letter{text-transform:uppercase}
.alc__l ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.alc__l li{display:grid;grid-template-columns:16px 1fr;gap:10px;font-size:.9rem;color:var(--ink-70);line-height:1.5}
.alc__l li i{width:6px;height:6px;border-radius:50%;background:var(--lilac);margin-top:8px}

.aviso{display:inline-flex;align-items:center;gap:10px;font-size:.92rem;font-weight:600;color:var(--violet-dark);
  background:var(--mist);border:1px solid var(--lilac-soft);border-radius:999px;padding:14px 24px 14px 20px}
.aviso:hover{background:#EDE7FC;border-color:var(--lilac)}
.aviso svg{width:17px;height:17px;color:var(--violet)}
@media(max-width:560px){ .aviso{font-size:.84rem;padding:12px 18px} }

/* resumo das ações */
.res3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
@media(max-width:640px){ .res3{grid-template-columns:1fr} }
.res3 div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-1)}
.res3 b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;line-height:1}
.res3 span{display:block;font-size:.8rem;color:var(--slate);margin-top:5px}
.esc3{display:grid;gap:10px;margin-top:22px}
.esc3 button{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;text-align:left;
  border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r-md);background:#fff;
  padding:15px 17px;font-size:.94rem;line-height:1.5;transition:background .15s,border-color .15s}
.esc3 button:hover{background:var(--mist)}
.esc3 button[aria-pressed="true"]{border-top-color:var(--ink);border-right-color:var(--ink);border-bottom-color:var(--ink);background:var(--ink);color:#fff}
.esc3 kbd{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--mist);
  border:1px solid var(--line);font-family:var(--f-mono);font-size:.62rem;color:var(--slate);margin-top:1px}
.esc3 button[aria-pressed="true"] kbd{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.esc3 small{display:block;font-size:.74rem;opacity:.7;margin-top:3px}
.final{counter-reset:a;display:grid;gap:12px;margin-top:20px;padding:0;list-style:none}
.final li{display:grid;grid-template-columns:30px 1fr;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-md);padding:15px 17px;box-shadow:var(--shadow-1);font-size:.96rem;line-height:1.5;list-style:none}
.final li::before{counter-increment:a;content:counter(a);font-family:var(--f-mono);font-size:.8rem;color:var(--violet);
  background:var(--mist);border-radius:8px;display:grid;place-items:center;height:26px}
.final li span span{display:block;font-size:.76rem;color:var(--slate);margin-top:3px}
/* grupos recolhidos */
.det2{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff}
.det2 summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:12px;
  font-size:.96rem;font-weight:600;color:var(--ink)}
.det2__n{margin-left:auto;font-family:var(--f-mono);font-size:.88rem;font-weight:500;color:var(--ink-70)}
.det2 summary::-webkit-details-marker{display:none}
.det2 summary svg{width:15px;height:15px;color:var(--slate);transition:transform .2s}
.det2[open] summary svg{transform:rotate(180deg)}
.det2__b{padding:0 18px 16px}
.pl--btn{text-align:left;cursor:pointer;border-radius:10px;padding-left:6px;padding-right:6px;margin-left:-6px;width:calc(100% + 12px)}
.pl--btn:hover{background:var(--mist)}
.role{display:flex;align-items:center;gap:8px;color:var(--violet)}
.role .k{font-size:11.5px;letter-spacing:.17em;color:var(--violet)}
.role svg{width:17px;height:17px;animation:roleDown 1.8s ease-in-out infinite}
@keyframes roleDown{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(4px);opacity:1}}
/* assistente flutuante */
.fab{position:fixed;right:22px;bottom:22px;z-index:55;display:inline-flex;align-items:center;gap:9px;
  border-radius:999px;background:var(--ink);color:#fff;padding:13px 20px 13px 17px;font-size:.86rem;font-weight:600;
  box-shadow:0 14px 34px -12px rgba(20,18,28,.5)}
.fab svg{width:17px;height:17px}
.fab--i{width:52px;height:52px;padding:0;justify-content:center;gap:0}
.fab--i svg{width:20px;height:20px}
.fab--i:hover{transform:translateY(-2px)}
@media(max-width:560px){ .fab--i{width:48px;height:48px} .fab--i svg{width:18px;height:18px} }
@media(max-width:860px){ body[data-tabs="1"] .fab{bottom:86px} }
@media(max-width:860px){ body[data-diario="1"] .tl{padding-bottom:210px} }


/* ============================================================
   BLOCO 4 · somar, convite, primeira parte feita
   ============================================================ */
/* busca de empresa */
.busca{position:relative;margin-top:22px;max-width:560px}
.busca__in{width:100%;border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;font-size:1rem;
  background:#fff;box-shadow:var(--shadow-1)}
.busca__in:focus{outline:0;border-color:var(--lilac);box-shadow:0 0 0 3px var(--mist)}
.busca__l{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);overflow:hidden;max-height:310px;overflow-y:auto}
.busca__i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 17px;
  border-top:1px solid var(--line-soft);font-size:.95rem}
.busca__i:first-child{border-top:0}
.busca__i:hover{background:var(--mist)}
.busca__i b{font-weight:600}
.busca__i span{font-family:var(--f-mono);font-size:10.5px;color:var(--slate);margin-left:auto;white-space:nowrap}
.busca__nova{color:var(--violet-dark);font-weight:600}
.busca__err{color:var(--slate);font-size:.86rem;cursor:default}
.busca__err:hover{background:none}
.termos{display:flex;align-items:flex-start;gap:10px;font-size:.82rem;color:var(--ink-70);line-height:1.5;cursor:pointer}
.termos input{width:17px;height:17px;margin-top:1px;accent-color:var(--violet);flex:none;cursor:pointer}
.linkq{color:var(--violet);text-decoration:underline;text-underline-offset:3px;font-size:inherit;padding:0}
/* cartão do pulso */
.pulso{margin-top:22px;border-radius:var(--r-xl);padding:26px 28px;color:#EFE9FF;position:relative;overflow:hidden;
  background:radial-gradient(72% 90% at 68% 12%, rgba(122,92,214,.3), transparent 62%),
             linear-gradient(158deg,#171227 0%,#120E22 54%,#0C0918 100%);
  border:1px solid rgba(255,255,255,.07);box-shadow:0 30px 70px -36px rgba(20,12,50,.55)}
.pulso__k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--lilac)}
.pulso__t{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:10px;flex-wrap:wrap}
.pulso__n{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;font-size:1.5rem;color:#fff}
.pulso__v{font-family:var(--f-display);font-variation-settings:'opsz' 96;font-weight:400;font-size:2.4rem;line-height:.9}
.pulso__v small{font-family:var(--f-mono);font-size:.32em;color:#8E86A0;margin-left:2px}
.pulso__d{font-size:.86rem;color:#C9C2E0;margin:6px 0 0}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(173,146,240,.42)}
.dots i.eu{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.pulso__f{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);
  font-size:.8rem;color:#9C94B4;display:flex;gap:10px;align-items:flex-start}
.pulso__f svg{width:14px;height:14px;flex:none;margin-top:2px}
.caixao{display:grid;grid-template-columns:46px 1fr 46px;gap:18px;align-items:center;width:100%;text-align:left;
  background:#fff;border:1px solid var(--lilac-soft);border-radius:22px;box-shadow:var(--shadow-1);
  padding:24px 26px;position:relative;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .3s}
.caixao:hover{border-color:var(--lilac);transform:translateY(-3px);box-shadow:var(--shadow-2)}
.caixao__ic{width:46px;height:46px;border-radius:14px;background:var(--mist);color:var(--violet);
  display:grid;place-items:center}
.caixao__ic svg{width:20px;height:20px}
.caixao--off .caixao__ic{background:var(--line-soft);color:var(--slate)}
.caixao::after{content:'';position:absolute;inset:-5px;border-radius:calc(var(--r-xl) + 5px);
  border:2px solid var(--lilac);opacity:0;pointer-events:none;animation:exPulsa 2.6s ease-out infinite}
.caixao--off{cursor:default;border-color:var(--line);opacity:1;box-shadow:none}
.caixao--off .caixao__t,.caixao--off .caixao__d{color:var(--slate)}
.caixao--off::after{display:none}
.caixao--off:hover{transform:none;border-color:var(--line);box-shadow:none}
.caixao__t{display:block;font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;
  font-size:1.14rem;color:var(--ink);line-height:1.2;letter-spacing:-.008em}
.caixao__d{display:block;font-size:.86rem;color:var(--ink-70);margin-top:6px;line-height:1.5;max-width:56ch}
.caixao__s{width:46px;height:46px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;justify-self:end}
.caixao__s svg{width:19px;height:19px}
.caixao--off .caixao__s{background:var(--line);color:var(--slate)}
@media(max-width:560px){ .caixao{grid-template-columns:40px 1fr;padding:20px 18px;gap:14px}
  .caixao__t{font-size:1.06rem} .caixao__ic{width:40px;height:40px} .caixao__s{display:none} }
@media(prefers-reduced-motion:reduce){ .caixao::after{display:none} }

/* selo */
.selo{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;
  background:rgba(62,158,134,.12);color:var(--ink-70);   /* o texto na cor do texto; o verde no fundo e no ícone (21/09) */
  font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase}
.selo svg{width:14px;height:14px;color:#2E7A66}
/* convite */
.conv{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--shadow-1);padding:28px 30px}
.conv__k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--violet);margin:0}
.conv__tit{font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;
  font-size:clamp(22px,2.8vw,28px);line-height:1.15;margin:0;letter-spacing:-.01em}
h2.h2--em em{font-style:normal;color:var(--violet)}
.conv__h{max-width:none;white-space:nowrap}
.conv__h em{font-style:normal;color:var(--violet)}
@media(max-width:820px){ .conv__h{white-space:normal;max-width:20ch} }
.conv__t{font-family:var(--f-display);font-variation-settings:'opsz' 72;font-weight:500;font-size:clamp(24px,3.2vw,32px);
  line-height:1.18;margin:12px 0 0;letter-spacing:-.008em}
.conv__t em{font-style:normal;color:var(--violet)}
.conv__d{font-size:.9rem;color:var(--ink-70);margin:10px 0 0;max-width:56ch;line-height:1.6}
.conv__link{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
  border:1px solid var(--line);background:var(--mist);border-radius:13px;padding:8px 8px 8px 15px;
  font-family:var(--f-mono);font-size:.78rem;color:var(--ink-70)}
.conv__link button{border:0;border-radius:10px;background:var(--violet);color:#fff;padding:10px 16px;
  font-size:.78rem;font-weight:600;font-family:var(--f-body)}
.canais{display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:16px}
.canais>button{flex:1 1 76px;display:grid;justify-items:center;gap:8px;padding:8px 2px;border-radius:12px;color:var(--slate)}
.canais>button:hover{background:var(--mist)}
.cvs__c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.cvs__c svg{width:19px;height:19px;color:var(--violet-dark)}
.cvs__l{font-family:var(--f-mono);font-size:9.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
/* primeira parte feita · bloco escuro no padrão do herói */
.mhero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:34px 38px 32px;color:#EFE9FF;
  background:radial-gradient(72% 92% at 64% 18%, rgba(122,92,214,.32), transparent 64%),
             radial-gradient(40% 50% at 6% 104%, rgba(62,158,134,.14), transparent 60%),
             linear-gradient(158deg,#100D1D,#181330 52%,#0B0916);
  border:1px solid rgba(255,255,255,.07);box-shadow:0 40px 90px -40px rgba(20,12,50,.6)}
@media(max-width:700px){ .mhero{padding:26px 22px 24px} }
.mhero__f{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.mhero__f path{fill:none;stroke:rgba(190,168,255,.18);stroke-width:1}
.mhero__in{position:relative;z-index:2}
.selo--d{background:rgba(62,158,134,.18);color:#7FD8BE}
.mhero__h{font-family:var(--f-display);font-variation-settings:'opsz' 96;font-weight:430;
  font-size:clamp(28px,4.2vw,42px);line-height:1.08;letter-spacing:-.028em;margin:18px 0 0;color:#fff;max-width:20ch}
.mhero__h em{font-style:normal;color:#C6B1FA}
.mhero__l{margin:16px 0 0;color:#C9C2E0;font-size:1rem;max-width:48ch;line-height:1.55}
.mhero__n{display:flex;gap:34px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.09)}
.mhero__n div{font-size:.76rem;color:#9C94B4}
.mhero__n b{display:block;font-family:var(--f-mono);font-size:1.5rem;color:#fff;font-weight:500;line-height:1.1}
.passo1{display:grid;grid-template-columns:44px 1fr auto;gap:20px;align-items:center;width:100%;
  margin-top:18px;background:linear-gradient(180deg,#F7FDFB,#fff);border:1px solid rgba(62,158,134,.28);
  border-radius:var(--r-xl);box-shadow:var(--shadow-1);padding:22px 28px}
.passo1__n{width:44px;height:44px;border-radius:50%;background:rgba(62,158,134,.14);color:var(--calm);
  display:grid;place-items:center}
.passo1__n svg{width:20px;height:20px}
.passo1__t{display:block;font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;
  font-size:1.16rem;color:var(--ink);line-height:1.2}
.passo1__d{display:block;font-size:.88rem;color:var(--ink-70);margin-top:6px;line-height:1.55;max-width:52ch}
.passo1__s{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--calm);flex:none}
@media(max-width:640px){ .passo1{grid-template-columns:40px 1fr;gap:14px;padding:20px}
  .passo1__s{grid-column:2} }

/* o próximo passo, em destaque */
.passo2{display:grid;grid-template-columns:44px 1fr auto;gap:20px;align-items:center;width:100%;text-align:left;
  margin-top:16px;background:#fff;border:1px solid var(--lilac-soft);border-radius:var(--r-xl);
  box-shadow:var(--shadow-1);padding:26px 28px;position:relative;cursor:pointer;
  transition:border-color .16s,transform .14s,box-shadow .16s}
.passo2:hover{border-color:var(--lilac);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.passo2::after{content:'';position:absolute;inset:-5px;border-radius:calc(var(--r-xl) + 5px);
  border:2px solid var(--lilac);opacity:0;pointer-events:none;animation:exPulsa 2.6s ease-out infinite}
@media(prefers-reduced-motion:reduce){ .passo2::after{display:none} }
.passo2__n{width:44px;height:44px;border-radius:50%;background:var(--mist);color:var(--violet);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:1rem}
.passo2__t{display:block;font-family:var(--f-display);font-variation-settings:'opsz' 48;font-weight:500;font-size:1.3rem;color:var(--ink);line-height:1.2}
.passo2__d{display:block;font-size:.9rem;color:var(--ink-70);margin-top:7px;line-height:1.55;max-width:52ch}
.passo2__p{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:5px 12px;border-radius:999px;
  background:var(--mist);color:var(--violet-dark);font-size:.74rem;font-weight:600}
.passo2__s{width:44px;height:44px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;flex:none}

.salvo{display:grid;grid-template-columns:38px 1fr;gap:16px;align-items:start;margin-top:14px;
  padding:18px 22px;border-radius:var(--r-lg);background:var(--mist);border:1px solid var(--line)}

  .salvo__i{width:32px;height:32px} .salvo__i svg{width:16px;height:16px} }

/* primeira parte feita */
.placar{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
@media(max-width:760px){ .placar{grid-template-columns:1fr} }
.ex{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:22px 24px}

.ex--btn:hover{border-color:var(--lilac);transform:translateY(-1px)}
.ex--pulsa::after{content:'';position:absolute;inset:-4px;border-radius:calc(var(--r-lg) + 4px);

@keyframes exPulsa{0%{opacity:.55;transform:scale(1)}70%{opacity:0;transform:scale(1.02)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){ .ex--pulsa::after{display:none} }
.ex__h{display:flex;align-items:center;gap:10px}
.ex__n{width:28px;height:28px;border-radius:50%;background:var(--mist);color:var(--violet);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem}
.ex--ok .ex__n{background:rgba(62,158,134,.16);color:var(--calm)}
.ex__t{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.1rem;color:var(--ink)}

  background:var(--mist);color:var(--violet-dark);font-size:.76rem;font-weight:600}


/* ============================================================
   BLOCO 5 · o diário, em forma de conversa
   ============================================================ */
body[data-diario="1"]{background:#FBFAFE}
.dtopo{position:sticky;top:var(--top);z-index:40;padding:18px 0 15px;

@media(max-width:760px){

}
.passos{display:flex;gap:7px;margin-top:15px;overflow-x:auto;scrollbar-width:none}
.passos::-webkit-scrollbar{display:none}
.pchip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 14px;white-space:nowrap;
  border:1px solid var(--line);background:#fff;font-size:.78rem;color:var(--slate);flex:none;transition:all .16s}

/* a conversa */
.tl{max-width:820px;margin:0 auto;padding:0 20px 130px}
.tl__abre{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);padding:22px 24px;display:grid;grid-template-columns:38px 1fr;gap:16px}
.tl__abre .av{width:38px;height:38px}
.tl__abre p{font-size:.95rem;color:var(--ink-70);line-height:1.62;margin:0;max-width:60ch}
/* rótulo acima de cada pergunta */
.msg__k{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--violet);margin-bottom:9px}

/* bolhas */
.msg{display:grid;grid-template-columns:38px 1fr;gap:14px;margin-top:30px;align-items:start}

  background:linear-gradient(150deg,#1D1733,#120E22);color:var(--lilac)}

/* perguntando: fundo claro e anel pulsando */
.av--ask{background:#fff;border:1px solid var(--lilac-soft);color:var(--violet)}

  padding:16px 20px;box-shadow:var(--shadow-1);max-width:62ch}

.msg__a{font-size:.85rem;color:var(--ink-70);margin:7px 0 0;line-height:1.5}
/* a resposta, do lado de quem escreve */
.eu{display:flex;flex-direction:column;align-items:flex-end;margin-top:10px}

  padding:16px 20px;font-size:.98rem;line-height:1.62;white-space:pre-wrap;max-width:min(62ch,88%);
  box-shadow:0 18px 40px -22px rgba(20,12,50,.45)}
.eu__meta{display:flex;align-items:center;gap:10px;margin-top:8px}

@media(max-width:620px){ .escreve__dica{display:none}
  .msg{grid-template-columns:30px 1fr;gap:11px} .av{width:30px;height:30px} .av .mark{width:12px;height:17px}
  .msg__b{padding:14px 16px} .msg--ok .msg__b{padding:0} .eu__b{max-width:94%;padding:14px 16px}
  .msg .av,.msg--ok .av{margin-top:24px} }
/* passo ainda fechado */
.tl__lock{margin-top:32px;border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:20px 22px;
  display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:center;background:rgba(255,255,255,.6)}

.tb__i{position:relative;display:grid;place-items:center}
.tb__b{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--violet);color:#fff;font-family:var(--f-mono);font-size:9.5px;font-weight:500;
  display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper);animation:badge 2.4s ease-out infinite}
@keyframes badge{0%,100%{transform:scale(1)}8%{transform:scale(1.14)}16%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){ .tb__b{animation:none} }

/* botão de conta no canto e a gaveta de conta */
.hamb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--slate);
  border:1px solid var(--line);background:#fff;margin-left:10px;flex:none}

  letter-spacing:.01em}

  display:flex;flex-direction:column;box-shadow:-30px 0 80px -30px rgba(20,12,50,.4);
  animation:mcEntra .26s var(--ease) both}
@keyframes mcEntra{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.mc__h{display:flex;align-items:flex-start;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 22px 18px;
  border-bottom:1px solid var(--line-soft)}

.mc__t{display:block;font-size:.95rem;color:var(--ink);font-weight:500}

.mc__f{border-top:1px solid var(--line-soft);padding:16px 22px calc(18px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:12px}

/* o assistente em tela cheia, com cara de chat */

.asp__av .mark{width:15px;height:21px}
.asp__t{font-family:var(--f-display);font-variation-settings:'opsz' 36;font-weight:500;font-size:1.06rem;line-height:1.1}
.asp__c{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:3px}

/* ============================================================
   O ASSISTENTE · gaveta em três estados
   ============================================================ */
.gav{position:fixed;inset:0;z-index:120;display:none}
.gav.on{display:block}

}

.gav__c{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:3px}

.gav__f{border-top:1px solid var(--line-soft);padding:12px 14px 13px;background:var(--paper)}
